<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="serif"><defs><linearGradient id="ming_red_yi_cannon__cbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf6e3"/><stop offset="1" stop-color="#f0e0c0"/></linearGradient><filter id="ming_red_yi_cannon__paper"><feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.4  0 0 0 0 0.25  0 0 0 0.08 0"/><feComposite in2="SourceGraphic" operator="in"/></filter></defs><rect width="720" height="420" fill="url(#ming_red_yi_cannon__cbg)"/><rect width="720" height="420" fill="#000" filter="url(#ming_red_yi_cannon__paper)" opacity="0.7"/><rect x="8" y="8" width="704" height="404" fill="none" stroke="#8b6a3a" stroke-width="2" stroke-dasharray="8 4"/><rect x="14" y="14" width="692" height="392" fill="none" stroke="#a89070" stroke-width="0.8"/><text x="360" y="46" text-anchor="middle" fill="#5b2a2a" font-size="22" font-weight="bold" letter-spacing="6">明 · 红夷铜炮铸造工序</text><line x1="120" y1="58" x2="600" y2="58" stroke="#8b3a3a" stroke-width="1.2"/><text x="360" y="105" text-anchor="middle" fill="#3a2818" font-size="17" letter-spacing="2">内模：泥塑 → 草绳缠裹 → 外壁再敷泥</text><text x="360" y="140" text-anchor="middle" fill="#3a2818" font-size="14" letter-spacing="2">↓</text><text x="360" y="170" text-anchor="middle" fill="#3a2818" font-size="17" letter-spacing="2">配铜：紫铜七 · 锡二 · 铅一 熔于坩埚</text><text x="360" y="205" text-anchor="middle" fill="#3a2818" font-size="14" letter-spacing="2">↓</text><text x="360" y="235" text-anchor="middle" fill="#3a2818" font-size="17" letter-spacing="2">浇铸：一次注满模腔（断流即废）→ 冷 5–7 日</text><text x="360" y="270" text-anchor="middle" fill="#3a2818" font-size="14" letter-spacing="2">↓</text><text x="360" y="300" text-anchor="middle" fill="#3a2818" font-size="17" letter-spacing="2">镗膛：以钢钻水力转炮身，精修内膛</text><text x="360" y="340" text-anchor="middle" fill="#3a2818" font-size="14" letter-spacing="2">↓</text><text x="360" y="370" text-anchor="middle" fill="#3a2818" font-size="15" letter-spacing="2">试炮 · 装具 · 入军械库（宁远城炮）</text><text x="360" y="402" text-anchor="middle" fill="#8b6a3a" font-size="13" letter-spacing="2">徐光启 · 孙元化 · 万历至崇祯</text></svg>
