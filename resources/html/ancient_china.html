<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>朝代浮岛 · 时间长河 · 中国朝代与少数民族 3D 编年图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#04060d;color:#e6e8ef;
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
#app{position:relative;width:100%;height:100%}
#cv{position:absolute;inset:0}

/* 顶部标题 */
#header{position:absolute;top:0;left:0;right:0;padding:14px 22px;z-index:10;
  background:linear-gradient(180deg,rgba(4,6,13,.95),rgba(4,6,13,0));
  display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#header h1{font-size:18px;letter-spacing:2px;color:#f3d28a;pointer-events:auto;
  text-shadow:0 0 8px rgba(243,210,138,.4)}
#header .sub{font-size:12px;color:#9aa3b8;pointer-events:auto}

/* 工具栏 */
#toolbar{position:absolute;top:56px;left:50%;transform:translateX(-50%);
  background:rgba(8,12,28,.78);border:1px solid rgba(255,255,255,.08);
  border-radius:24px;padding:5px;display:flex;gap:4px;z-index:10;backdrop-filter:blur(6px)}
#toolbar button{padding:6px 13px;font-size:12px;color:#d8dceb;background:transparent;
  border:none;border-radius:20px;cursor:pointer;transition:all .2s}
#toolbar button:hover{background:rgba(243,210,138,.15);color:#f3d28a}
#toolbar button.active{background:#f3d28a;color:#0b1020;font-weight:600}

/* 筛选条 — 左下角 */
#filterbar{position:absolute;left:14px;bottom:14px;
  background:rgba(8,12,28,.88);border:1px solid rgba(255,255,255,.1);
  border-radius:12px;padding:10px 14px;z-index:70;backdrop-filter:blur(8px);
  display:flex;flex-direction:column;gap:6px;width:480px;max-width:calc(100% - 28px);
  box-shadow:0 8px 28px rgba(0,0,0,.5)}
#filterbar .fbar-row{display:flex;align-items:center;gap:6px;font-size:11px;color:#cbd2e2;flex-wrap:wrap}
#filterbar .fbar-row-title{justify-content:space-between;font-size:11.5px;font-weight:600;border-bottom:1px dashed rgba(255,255,255,.08);padding-bottom:4px}
#filterbar .fbar-label{color:#f3d28a;letter-spacing:1px}
#filterbar input[type=range]{flex:1;accent-color:#f3d28a;height:4px;min-width:0}
#filterbar #yr-row{gap:8px;flex-wrap:nowrap}
#filterbar #yr-display{color:#7ad0ff;font-family:monospace;font-size:11px}
#filterbar .fbar-btn{background:rgba(243,210,138,.15);color:#f3d28a;border:1px solid rgba(243,210,138,.3);
  border-radius:5px;padding:2px 10px;font-size:10.5px;cursor:pointer}
#filterbar .fbar-btn:hover{background:rgba(243,210,138,.3)}
/* 朝代按钮组 (横向铺平 + 自动换行) */
#dyn-buttons{gap:4px;position:relative}
#dyn-buttons .dyn-btn{padding:3px 8px;font-size:10.5px;color:#cbd2e2;
  background:rgba(40,50,80,.55);border:1px solid rgba(255,255,255,.1);
  border-radius:12px;cursor:pointer;transition:all .15s;line-height:1.2}
#dyn-buttons .dyn-btn:hover{border-color:#f3d28a;color:#f3d28a}
#dyn-buttons .dyn-btn.active{background:#f3d28a;color:#0b1020;font-weight:600;border-color:#f3d28a}
/* 五代十国分组按钮 + 弹出列表 */
.dyn-group-wrap{position:relative;display:inline-block}
.dyn-btn.dyn-group-btn::after{content:" ▴";font-size:10px;opacity:.8}
.dyn-popover{position:absolute;bottom:calc(100% + 6px);left:0;z-index:80;
  background:rgba(10,14,30,.96);border:1px solid rgba(243,210,138,.35);
  border-radius:8px;padding:6px;display:none;min-width:260px;max-width:360px;
  box-shadow:0 -8px 24px rgba(0,0,0,.6);backdrop-filter:blur(6px)}
.dyn-popover::after{content:"";position:absolute;top:100%;left:14px;
  border:6px solid transparent;border-top-color:rgba(243,210,138,.35)}
.dyn-popover.show{display:flex;flex-wrap:wrap;gap:4px}
.dyn-popover .dyn-sub{padding:3px 8px;font-size:10.5px;border-radius:10px;
  background:rgba(40,50,80,.55);border:1px solid rgba(255,255,255,.12);
  color:#cbd2e2;cursor:pointer;transition:all .15s;line-height:1.2}
.dyn-popover .dyn-sub:hover{border-color:#f3d28a;color:#f3d28a}
.dyn-popover .dyn-sub.active{background:#f3d28a;color:#0b1020;font-weight:600;border-color:#f3d28a}

#hint{position:absolute;bottom:14px;right:14px;font-size:11px;
  color:#9aa3b8;background:rgba(8,12,28,.6);padding:5px 12px;border-radius:18px;
  border:1px solid rgba(255,255,255,.06);z-index:10;text-align:center;max-width:340px}

#legend{position:absolute;left:14px;top:56px;background:rgba(8,12,28,.78);
  border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:9px 12px;
  font-size:11px;z-index:10;backdrop-filter:blur(6px);max-width:230px}
#legend h3{font-size:12px;color:#f3d28a;margin-bottom:5px}
#legend .item{display:flex;align-items:center;margin:3px 0;color:#cbd2e2}
#legend .swatch{width:12px;height:12px;border-radius:3px;margin-right:8px}
#legend .ring{width:12px;height:12px;border-radius:50%;border:2px solid;margin-right:8px;background:transparent}

/* 右侧详情面板 */
#panel{position:absolute;right:14px;top:56px;width:420px;max-height:calc(100% - 100px);
  background:rgba(10,14,30,.93);border:1px solid rgba(243,210,138,.28);
  border-radius:14px;padding:18px 20px;overflow-y:auto;z-index:60;
  box-shadow:0 12px 40px rgba(0,0,0,.7);backdrop-filter:blur(10px);
  transform:translateX(120%);transition:transform .35s ease}
#panel.show{transform:translateX(0)}
#panel h2{color:#f3d28a;font-size:20px;margin-bottom:4px;letter-spacing:1.5px;flex-shrink:0}
#panel .p-header{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap}
#panel .p-header .tribes{margin-bottom:0;flex:1;min-width:0}
#panel .meta{color:#9aa3b8;font-size:12px;margin-bottom:10px}
#panel .tribes{margin-bottom:12px;display:flex;flex-wrap:wrap;column-gap:8px;row-gap:14px;padding-top:8px}
#panel .tribes .tag{font-size:11px;padding:2px 8px;border-radius:12px;
  background:rgba(255,255,255,.05);border:1px solid currentColor}
#panel .tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:7px}
#panel .tab{font-size:12px;color:#9aa3b8;padding:4px 10px;border-radius:6px;cursor:pointer}
#panel .tab.active{color:#f3d28a;background:rgba(243,210,138,.15)}
#panel .tab:hover{color:#f3d28a}

/* 少数民族面板 */
#minority-panel{position:absolute;right:14px;top:56px;width:400px;max-height:calc(100% - 100px);
  background:rgba(10,14,30,.94);border:1px solid rgba(122,208,255,.38);
  border-radius:14px;padding:18px 20px;overflow-y:auto;z-index:60;
  box-shadow:0 12px 40px rgba(0,0,0,.75);backdrop-filter:blur(10px);
  transform:translateX(120%);transition:transform .35s ease}
#minority-panel.show{transform:translateX(0)}
#minority-panel h2{color:#7ad0ff;font-size:20px;margin-bottom:4px;letter-spacing:1px}
#minority-panel .meta{color:#9aa3b8;font-size:12px;margin-bottom:8px}
#minority-panel .mp-desc{color:#cbd2e2;font-size:13px;line-height:1.7;margin-bottom:14px;
  padding:10px;background:rgba(122,208,255,.06);border-radius:8px;border-left:3px solid rgba(122,208,255,.5)}
#minority-panel .mp-section-title{color:#f3d28a;font-size:13px;margin:12px 0 6px;padding-bottom:4px;
  border-bottom:1px solid rgba(255,255,255,.08)}
#minority-panel .mp-item{color:#cbd2e2;font-size:12px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.06);line-height:1.6}
#minority-panel .mp-item .yr{color:#f3d28a;margin-right:6px;font-weight:bold}
#minority-panel .mp-item .parties{color:#ff9a9a}
#mp-close{position:absolute;top:10px;right:12px;width:24px;height:24px;
  background:none;border:none;color:#9aa3b8;font-size:20px;cursor:pointer;line-height:1}
#mp-close:hover{color:#7ad0ff}

/* 时间线 */
#p-timeline{position:relative;padding-left:26px}
/* 虚线主轴 - 轴心精确穿过圆点几何中心 (x=14px)
   圆点 left:-20px width:12px border:2px → 实际中心 = 26 + (-20) + 6 + 2 = 14px
   border-left:2px 中线 = left + 1px,所以 left=13 → 中线 14px ✓ */
#p-timeline::before{content:"";position:absolute;left:13px;top:4px;bottom:4px;width:0;
  border-left:2px dashed rgba(243,210,138,.55);z-index:0}
.tl-item{position:relative;padding:16px 0 16px 8px;border-bottom:1px dashed rgba(255,255,255,.06)}
.tl-item:last-child{border-bottom:none}
/* 圆点几何中心精确落在虚线轴心 (x=12px) 上
   tl-item 左缘 = 父 padding-left = 26px → 圆点 left = 12 - 26 = -14px,再 -dotR(=6) = -20px
   12px 圆点,top:50% transform:translateY(-50%) → 垂直居中
   z-index:1 让圆点叠在虚线之上;box-shadow 用半透明边框,虚线穿过不被截断 */
.tl-item::before{content:"";position:absolute;left:-20px;top:50%;transform:translateY(-50%);
  width:12px;height:12px;border-radius:50%;background:#f3d28a;
  box-shadow:0 0 10px #f3d28a;border:2px solid #0b1020;box-sizing:content-box;z-index:1}
.tl-item.relation::before{background:#7ad0ff;box-shadow:0 0 10px #7ad0ff}
.tl-item.event::before{background:#a0e87a;box-shadow:0 0 10px #a0e87a}
.tl-item.war::before{background:#ff5a5a;box-shadow:0 0 10px #ff5a5a}
.tl-item .yr{display:inline-block;font-size:11px;color:#f3d28a;font-weight:600;
  background:rgba(243,210,138,.1);padding:1px 6px;border-radius:3px;margin-right:6px}
.tl-item .txt{font-size:13px;color:#cbd2e2;line-height:1.6}
.tl-item .factions{margin-top:4px;font-size:11px;color:#9aa3b8}
.tl-item .factions .f{display:inline-block;color:#ff8a8a;background:rgba(255,90,90,.1);
  padding:1px 5px;border-radius:3px;margin:0 2px;font-weight:600}

/* 人物徽章 — 朴素版:角色图标 + 实线边框 + 单色文字 + hover 反色 */
.person{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;margin:6px 2px;
  border-radius:5px;font-weight:700;cursor:help;font-size:13px;line-height:1.4;
  border:1px solid var(--pc);color:var(--pc);background:transparent;
  transition:background-color .15s, color .15s;white-space:nowrap;position:relative}
.person::before{content:attr(data-icon);font-size:15px;opacity:.95;font-weight:normal;line-height:1}
.person:hover{background:var(--pc);color:#0b1020;z-index:2}
.person:hover::before{opacity:1;color:#0b1020}
.person.emperor{--pc:#f3d28a}
.person.general{--pc:#ff8a6a}
.person.advisor{--pc:#7ad0ff}
.person.envoy  {--pc:#a0e87a}
.person.tribe  {--pc:#c89dff}

/* 人物词卡 - 信息更丰富 */
#person-card{position:fixed;display:none;z-index:200;width:320px;
  background:linear-gradient(135deg,rgba(20,26,50,.97),rgba(10,14,30,.97));
  border:1px solid rgba(243,210,138,.4);border-radius:10px;padding:12px 14px;
  box-shadow:0 10px 30px rgba(0,0,0,.7);font-size:12px;pointer-events:none}
#person-card .pc-head{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.08)}
#person-card .pc-name{font-size:17px;color:#f3d28a;font-weight:700;letter-spacing:1px}
/* 拼音注音 - rt 绝对定位向上"溢出"父容器,完全不改变父容器尺寸/对齐 */
ruby{
  display:inline-block;
  position:relative;
  line-height:inherit;
  vertical-align:baseline;
  text-align:center;
  /* 主字间加大横向间距,给上方拼音让出空间 */
  margin:0 4px;
}
ruby rt{
  position:absolute;
  left:50%;
  bottom:calc(100% + 3px);
  transform:translateX(-50%);
  font-size:9px;
  line-height:1;
  white-space:nowrap;
  color:#9aa3b8;
  font-weight:400;
  /* 拼音字母之间留 0.6px,避免单个拼音内部太挤 */
  letter-spacing:0.6px;
  pointer-events:none;
  text-shadow:0 0 3px rgba(8,12,22,0.95),0 0 2px rgba(8,12,22,0.95);
  z-index:3;
  /* 限制拼音最大宽度,超过则不放大 ruby */
  max-width:none;
}
/* 标题和大字号场景下,拼音可以略大一点,因为父容器汉字本身就宽 */
#p-title ruby rt,#mp-title ruby rt{font-size:11px;letter-spacing:0.6px}
#person-card .pc-name ruby rt{font-size:10px;letter-spacing:0.5px}
/* 关键: 不给父容器加 padding/margin,只确保 overflow 不裁切 */
.person,.tag,.pc-name,#p-title,#mp-title{overflow:visible}
/* 含 ruby 的容器需要更宽松的字间距(汉字之间疏一点,给拼音呼吸空间) */
.person:has(ruby),.tag:has(ruby),#p-title:has(ruby),#mp-title:has(ruby),.pc-name:has(ruby){
  letter-spacing:3px;
}
/* 标题场景需要更大一档字距,因为字号本身就大 */
#p-title:has(ruby),#mp-title:has(ruby){letter-spacing:4px}
/* 多行文字容器:含 ruby 时,加大行高 + 顶部 padding,让上一行不被拼音压到 */
.tl-item .txt:has(ruby),
#person-card .pc-desc:has(ruby),
#person-card .pc-evt:has(ruby),
#minority-panel .mp-item:has(ruby),
#minority-panel .mp-desc:has(ruby){
  line-height:2.4;
  padding-top:10px;
}
/* 颜色微调 */
#person-card .pc-name ruby rt{color:#f3d28a}
.person ruby rt{color:#fff}
#p-title ruby rt,#mp-title ruby rt{color:#cbd2e2}
#person-card .pc-role{font-size:11px;padding:2px 8px;border-radius:8px;
  background:rgba(255,255,255,.06);border:1px solid currentColor;font-weight:600}
#person-card .pc-meta{font-size:11px;color:#9aa3b8;margin-bottom:6px}
#person-card .pc-meta .pc-dyn{color:#f3d28a;background:rgba(243,210,138,.12);
  padding:1px 6px;border-radius:3px;margin-left:4px}
#person-card .pc-desc{font-size:12px;color:#cbd2e2;line-height:1.65;
  padding:6px 8px;background:rgba(255,255,255,.03);border-radius:6px;
  border-left:3px solid currentColor;margin-bottom:8px}
#person-card .pc-sec{font-size:10.5px;color:#f3d28a;margin:6px 0 3px;font-weight:600;
  letter-spacing:1px;opacity:.85}
#person-card .pc-evt{font-size:11px;color:#aeb8cc;line-height:1.55;padding:3px 0;
  border-top:1px dashed rgba(255,255,255,.06)}
#person-card .pc-evt:first-child{border-top:none}
#person-card .pc-evt .y{color:#f3d28a;font-weight:600;margin-right:6px}
#person-card .pc-rel{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
#person-card .pc-rel .r{font-size:10.5px;padding:1px 6px;border-radius:3px;
  background:rgba(255,255,255,.05);border:1px solid currentColor;font-weight:600}

/* 战争 hover 浮窗 — 层级要低于介绍面板/筛选条/朝代按钮组,避免遮挡 */
#tip{position:fixed;display:none;z-index:5;
  background:rgba(8,12,28,.95);border:1px solid rgba(243,210,138,.35);
  padding:8px 12px;border-radius:8px;font-size:12px;color:#e6e8ef;
  box-shadow:0 6px 18px rgba(0,0,0,.6);pointer-events:none;max-width:260px}
#tip .y{color:#f3d28a;font-weight:600;margin-right:6px}
#tip .f{display:inline-block;color:#ff8a8a;padding:1px 5px;border-radius:3px;
  background:rgba(255,90,90,.12);margin:0 2px;font-weight:600}

#close-btn{position:absolute;top:10px;right:12px;width:24px;height:24px;
  background:transparent;border:none;color:#9aa3b8;cursor:pointer;font-size:18px}
#close-btn:hover{color:#f3d28a}

#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  z-index:99;background:#04060d;color:#f3d28a;font-size:14px;letter-spacing:2px}
#loading.hidden{display:none}

@media (max-width:900px){
  #panel{width:calc(100% - 28px);top:auto;bottom:230px;max-height:40%}
  #minority-panel{width:calc(100% - 28px);top:auto;bottom:230px;max-height:40%}
  #legend{display:none}
  #filterbar{width:calc(100% - 28px)}
  #filterbar #yr-row{gap:6px}
  #hint{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="cv"></div>
  <div id="header">
    <h1>朝代浮岛 · 时间长河</h1>
    <div class="sub">3D 漫游中国朝代与少数民族 (前221 — 1912)</div>
  </div>
  <div id="toolbar">
    <button id="btn-river" class="active">时间主轴</button>
    <button id="btn-wars" class="active">战争连线</button>
    <button id="btn-tribes" class="active">少数民族副线</button>
    <button id="btn-annex" class="active">吞并箭头</button>
    <button id="btn-tour">巡游</button>
    <button id="btn-reset">重置视角</button>
  </div>
  <div id="filterbar">
    <div class="fbar-row fbar-row-title">
      <span class="fbar-label">朝代筛选</span>
      <button id="btn-clear-filter" class="fbar-btn">清除全部</button>
    </div>
    <div class="fbar-row" id="dyn-buttons"></div>
    <div class="fbar-row fbar-row-title" style="margin-top:6px">
      <span class="fbar-label">时间范围</span>
      <span id="yr-display">前280 ~ 1912</span>
    </div>
    <div class="fbar-row" id="yr-row">
      <input type="range" id="yr-min" min="-280" max="1912" value="-280" step="1"/>
      <input type="range" id="yr-max" min="-280" max="1912" value="1912" step="1"/>
    </div>
  </div>
  <div id="legend">
    <h3>图例</h3>
    <div class="item"><span class="swatch" style="background:#f3d28a"></span>汉族王朝主线 (z=0)</div>
    <div class="item"><span class="swatch" style="background:#7ad0ff"></span>北方游牧副线 (上方)</div>
    <div class="item"><span class="swatch" style="background:#a0e87a"></span>东北/渔猎副线</div>
    <div class="item"><span class="swatch" style="background:#ffa07a"></span>西部/西南副线 (下方)</div>
    <div class="item" style="margin-top:6px;border-top:1px solid rgba(255,255,255,.08);padding-top:6px">
      <span class="swatch" style="background:#ff5a5a"></span>战争连线 (汉族 ↔ 少数民族)</div>
    <div class="item"><span class="swatch" style="background:#ffa040"></span>吞并箭头 (少数民族 → 少数民族)</div>
    <div class="item" style="margin-top:6px;color:#9aa3b8;font-size:10.5px;line-height:1.6">
      面板内悬停彩色徽章查看人物词卡
    </div>
  </div>
  <div id="hint">左键拖拽旋转 · 滚轮缩放 · 右键平移 · 点击主线/副线/弧线查看详情</div>
  <div id="panel">
    <button id="close-btn">×</button>
    <div class="p-header">
      <h2 id="p-title">—</h2>
      <div class="tribes" id="p-tribes"></div>
    </div>
    <div class="meta" id="p-meta">—</div>
    <div class="tabs">
      <div class="tab active" data-tab="all">综合时间线</div>
      <div class="tab" data-tab="relation">关系</div>
      <div class="tab" data-tab="event">事件</div>
      <div class="tab" data-tab="war">战争</div>
      <div class="tab" data-tab="people">人物</div>
    </div>
    <div id="p-timeline"></div>
  </div>
  <div id="minority-panel">
    <button id="mp-close">×</button>
    <h2 id="mp-title">—</h2>
    <div class="meta" id="mp-meta">—</div>
    <div class="mp-desc" id="mp-desc"></div>
    <h3 class="mp-section-title">相关战争</h3>
    <div id="mp-wars"></div>
    <h3 class="mp-section-title">相关吞并事件</h3>
    <div id="mp-annex"></div>
  </div>
  <div id="tip"></div>
  <div id="person-card"></div>
  <div id="loading">加载中 · 3D 朝代长河</div>

<script>
/* 数据层已抽取到 dynasty_data.js (PEOPLE / DYNASTIES / MINORITIES / ANNEXATIONS / TYPE_COLOR) */

/* ===================== Three.js 场景 ===================== */
let scene, camera, renderer, controls, raycaster, mouse;
let starGroup, riverMesh, islands=[], tribeFlags=[], warBeams=[];
let allPickable=[];
let currentTab='all', activeDynastyIdx=-1;
let showRiver=true, showWars=true, showTribes=true, tourMode=false;
let tourAngle=0;

const T_MIN=-280, T_MAX=1950;
// 旧坐标遗留:仅保留 yearToT/yearToPos (会被后面的 yearToX/yearToPos 覆盖),不再重复声明 RIVER_LEN
function yearToT(y){ return (y-T_MIN)/(T_MAX-T_MIN); }
/* (旧代码已清理) */

/* 时间→3D 坐标:横向时间轴(直线),Y/Z 由"轨道"决定 */
const RIVER_LEN = 360;
function yearToX(y){
  const t = (y-T_MIN)/(T_MAX-T_MIN);
  return -RIVER_LEN/2 + RIVER_LEN*t;
}
// 主线汉族居中(z=0,y=0), 北族在 z<0 (远), 南族在 z>0 (近);上下分行
const LANE_GAP = 12;
/* 贪心动态分轨:对每个 side 内的族群按 start 升序遍历,
   找到第一条"上一条已结束 + 间隙"的轨道放进去;放不下再开新轨道。
   保证时间重叠的族群一定不共用 z。结果写回 m._row。 */
function assignMinorityRows(){
  const GAP = 4; // 轨道空闲判定的最小年份缓冲
  ['top','bottom'].forEach(side=>{
    const list = MINORITIES.filter(m=>m.side===side)
                           .sort((a,b)=> a.life[0]-b.life[0]);
    const laneEnd = []; // 每条轨道当前末尾年份
    list.forEach(m=>{
      let placed = -1;
      for(let k=0;k<laneEnd.length;k++){
        if(m.life[0] >= laneEnd[k] + GAP){ placed = k; break; }
      }
      if(placed === -1){ placed = laneEnd.length; laneEnd.push(0); }
      laneEnd[placed] = m.life[1];
      m._row = placed; // 覆盖原 row,确保不重叠
    });
  });
}
function minorityZ(side, row){
  // side: 'top' (北族,z<0), 'bottom' (南族,z>0); row 越大离主线越远
  // 轨道间距随 row 增大略微收紧,避免远端飞出视野(top 最多 5 行/bottom 6 行)
  const sign = side==='top' ? -1 : 1;
  const STEP = 7;          // 每条轨道步进(原 LANE_GAP*0.85=10.2 过宽)
  return sign * (LANE_GAP + row*STEP);
}
function yearToPos(y){ return new THREE.Vector3(yearToX(y), 0, 0); }

function init(){
 try {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x04060d);

  camera.up.set(-1, 0, 0);
  camera.position.set(0, 260, 0.01); // y 高位俯视,z 给极小值避免 lookAt 退化

  renderer = new THREE.WebGLRenderer({antialias:true});

  renderer.setSize(innerWidth, innerHeight);

  controls = new THREE.OrbitControls(camera, renderer.domElement);

  controls.maxPolarAngle = Math.PI*0.49;
  controls.minPolarAngle = 0;
  controls.target.set(0, 0, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.65));
  const d1 = new THREE.DirectionalLight(0xfff4d8, 0.8); d1.position.set(80,120,60); scene.add(d1);
  const d2 = new THREE.DirectionalLight(0x6fa8ff, 0.4); d2.position.set(-60,80,-80); scene.add(d2);

  buildStars();
  buildRiver();
  buildIslands();
  buildMinorityBands();
  buildWarBeams();
  buildAnnexArrows();
  buildTimeAxis();

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();
  addEventListener('resize', onResize);
  renderer.domElement.addEventListener('pointermove', onPointerMove);
  renderer.domElement.addEventListener('click', onClick);

  bindUI();
  document.getElementById('loading').classList.add('hidden');
  animate();
  // 默认保持俯视视角(秦在上、清在下),不再自动飞向唐朝
 } catch(err) {
   console.error('init() crashed:', err);
   const el = document.getElementById('loading');
   if(el){
     el.classList.remove('hidden');
     el.style.flexDirection='column';
     el.style.padding='20px';
     el.style.textAlign='left';
     el.innerHTML = '<div style="color:#ff6b6b;font-size:18px;margin-bottom:10px">页面初始化失败</div>'
       + '<div style="color:#aaa;font-size:13px;max-width:80vw;word-break:break-all;white-space:pre-wrap">'
       + (err && err.stack ? err.stack : String(err)) + '</div>';
   }
 }

function buildStars(){
  const N=1800;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const r=400+Math.random()*500;
    const theta=Math.random()*Math.PI*2;
    const phi=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(phi)*Math.cos(theta);
    pos[i*3+1]=Math.abs(r*Math.cos(phi))*0.5+50;
    pos[i*3+2]=r*Math.sin(phi)*Math.sin(theta);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  starGroup = new THREE.Points(geo, new THREE.PointsMaterial({
    color:0xffffff,size:0.9,transparent:true,opacity:.65,sizeAttenuation:true
  }));
  scene.add(starGroup);
}

/* 主线时间长河:中央直线管状 */
function buildRiver(){
  const curve = new THREE.LineCurve3(
    new THREE.Vector3(-RIVER_LEN/2, 0, 0),
    new THREE.Vector3( RIVER_LEN/2, 0, 0)
  );
  const tube = new THREE.TubeGeometry(curve, 80, 4, 12, false);
  const mat = new THREE.MeshStandardMaterial({
    color:0xc99a3a, emissive:0xf3d28a, emissiveIntensity:0.45,
    metalness:0.7, roughness:0.3, transparent:true, opacity:0.65
  });
  riverMesh = new THREE.Mesh(tube, mat);
  riverMesh.position.y = -2;
  scene.add(riverMesh);

  // 中线粒子
  const PN=400;
  const g2=new THREE.BufferGeometry();
  const p2=new Float32Array(PN*3);
  for(let i=0;i<PN;i++){
    p2[i*3]   = -RIVER_LEN/2 + Math.random()*RIVER_LEN;
    p2[i*3+1] = 0.3+Math.random()*1.2;
    p2[i*3+2] = (Math.random()-.5)*3;
  }
  g2.setAttribute('position', new THREE.BufferAttribute(p2,3));
  const riverPoints = new THREE.Points(g2, new THREE.PointsMaterial({
    color:0xfff060,size:0.55,transparent:true,opacity:0.9
  }));
  riverPoints.userData.kind='river_dust';
  scene.add(riverPoints);
}

/* 汉族浮岛:沿主线居中,高度=国祚
   南北朝/三国/五代十国(branch=='south'/'north' 或数字 z)错位到主线两侧。
   branch 字段支持两种格式:
   - 字符串: 'south' = +9, 'north' = -9, 'center' = 0
   - 数字  : 直接作为 z 偏移量,适合需要密集错开的多政权场景(五代十国 15 国)
*/
function buildIslands(){
  DYNASTIES.forEach((d,idx)=>{
    const xS = yearToX(d.start);
    const xE = yearToX(d.end);
    const cx = (xS+xE)/2;
    // 朝代间留 0.4 单位间隙,避免相邻 island 边面 z-fight 抖动
    const len = Math.max(5, xE-xS) - 0.4;
    // 五代十国 (branch 为数字) 用更瘦的岛屿,避免在 z 方向互相穿插
    const isFiveTen = (typeof d.branch === 'number');
    const w = isFiveTen
      ? Math.min(7, len*0.35+3)
      : Math.min(13, len*0.5+5);
    // 汉族朝代统一高度,不再按时长高低不同(用户要求"不需要高低之分")
    // 五代十国仍保留略低高度,以与主线区分
    const h = isFiveTen ? 8 : 12;
    let cz = 0;
    if(typeof d.branch === 'number'){
      // 数字 branch 视为"轨道编号",拉开间距(原 8/16/24/-8 太挤)
      cz = d.branch * 1.6;
    }
    else if(d.branch === 'south') cz = 9;
    else if(d.branch === 'north') cz = -9;
    const geo = new THREE.BoxGeometry(len, h, w*0.9);
    const c = (d.colorKey && TYPE_COLOR[d.colorKey]) ? TYPE_COLOR[d.colorKey] : TYPE_COLOR.han;
    const mat = new THREE.MeshStandardMaterial({
      color:c, emissive:c, emissiveIntensity:0.22,
      metalness:0.5, roughness:0.45, flatShading:true,
      transparent:false, opacity:1, depthWrite:true, depthTest:true
    });
    const island = new THREE.Mesh(geo, mat);
    island.position.set(cx, h/2+1, cz);
    island.userData = {kind:'island', idx, name:d.name, group:d.group||null, top:h+1, y0:d.start, y1:d.end};
    scene.add(island); islands.push(island); allPickable.push(island);
    // 该朝代附属装饰物(旗杆/标签/年代/环带)用一个 Group 持有,
    // 便于 applyFilter 时随 island 一起隐藏
    const deco = new THREE.Group();
    deco.userData = {kind:'island_deco', idx};
    scene.add(deco);
    island.userData.deco = deco;

    // 旗杆
    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.2,0.2,7,6),
      new THREE.MeshBasicMaterial({color:c})
    );
    pole.position.set(cx, h+5, cz);
    deco.add(pole);

    // 朝代名(适中字号),颜色随分支着色;带半透明深色底,防止与背景文字混读
    // 相机俯视 up=(-1,0,0): -x 在屏幕上方,+x 在屏幕下方
    // 朝代名居中略向"屏幕上方"(即 -x 方向)偏移,年代条放在"屏幕下方"(+x),二者上下不重叠
    const labColor = '#'+c.toString(16).padStart(6,'0');
    const lab = makeTextSprite(d.name, labColor, 30, {bg:true});
    lab.position.set(cx - Math.max(2.5, w*0.55), h+9, cz);
    deco.add(lab);

    // 年代:放在岛屿"屏幕下方",并把高度抬高让它压在朝代名之上的 z-buffer 顺序里不冲突
    const yr = makeTextSprite(d.yearLabel, '#cbd2e2', 18, {bg:true});
    yr.position.set(cx + Math.max(2.5, w*0.55), h+9, cz);
    deco.add(yr);

    // (已移除岛屿环带 TorusGeometry — 用户反馈不需要)

    d._cx = cx; d._cz = cz; d._top = h+1; d._w = w; d._len = len;
    d._center = new THREE.Vector3(cx, h/2+1, cz);
  });
}

/* 少数民族副线:每个族群一根独立的横条 (BoxGeometry),
   长度=存续期, 颜色=类型, 上方北族 / 下方南族 */
const minorityIndex = new Map(); // name -> minority mesh
function buildMinorityBands(){
  assignMinorityRows();
  MINORITIES.forEach((m,i)=>{
    const xS = yearToX(m.life[0]);
    const xE = yearToX(m.life[1]);
    const cx = (xS+xE)/2;
    const z  = minorityZ(m.side, m._row);
    const len = Math.max(2, xE-xS);
    const c = TYPE_COLOR[m.type] || 0xffffff;
    const h = 2.6;
    const w = 2.8;
    const geo = new THREE.BoxGeometry(len, h, w);
    const mat = new THREE.MeshStandardMaterial({
      color:c, emissive:c, emissiveIntensity:0.7,
      metalness:0.3, roughness:0.45
    });
    const band = new THREE.Mesh(geo, mat);
    band.position.set(cx, h/2, z);
    band.userData = {kind:'minority', name:m.name, desc:m.desc, life:m.life, side:m.side, type:m.type};
    scene.add(band); tribeFlags.push(band); allPickable.push(band);
    minorityIndex.set(m.name, band);

    // 顶部一根细线(描边)让条带在远处也可辨
    const edge = new THREE.Mesh(
      new THREE.BoxGeometry(len, 0.18, w*0.6),
      new THREE.MeshBasicMaterial({color:c, transparent:true, opacity:0.85})
    );
    edge.position.set(cx, h+0.1, z);
    scene.add(edge);

    // 名称标签
    const lab = makeTextSprite(m.name, '#'+c.toString(16).padStart(6,'0'), 22);
    lab.position.set(xS-3.5, h/2+0.5, z);
    lab.center.set(1, 0.5);
    scene.add(lab);

    // 生卒小字
    const lifeLbl = `${m.life[0]<0?'前'+(-m.life[0]):m.life[0]}~${m.life[1]}`;
    const yrLab = makeTextSprite(lifeLbl, '#9aa3b8', 12);
    yrLab.position.set(cx, h+1.2, z);
    scene.add(yrLab);

    // 两端发光点
    [xS, xE].forEach(xx=>{
      const dot = new THREE.Mesh(
        new THREE.SphereGeometry(0.45, 12, 8),
        new THREE.MeshBasicMaterial({color:c, transparent:true, opacity:0.95})
      );
      dot.position.set(xx, h/2, z); scene.add(dot);
    });
  });
}

/* 战争连线:从汉族浮岛顶部 → 对应少数民族条带 (加粗+描边+实心箭头) */
function buildWarBeams(){
  DYNASTIES.forEach(d=>{
    d.wars.forEach(w=>{
      const facs = w.factions||[]; if(facs.length<2) return;
      const dynName = d.name;
      const opps = facs.filter(f=>f!==dynName);
      opps.forEach(opp=>{
        const band = minorityIndex.get(opp);
        if(!band) return;
        let xW = yearToX(w.y);
        const dz = d._cz || 0;  // 南北朝主线错位 z
        // 把起点夹紧到 island 的水平范围内,避免箭头从岛外悬空冒出
        if(typeof d._cx==='number' && typeof d._len==='number'){
          const half = d._len/2;
          const xMin = d._cx - half + 0.4;
          const xMax = d._cx + half - 0.4;
          xW = Math.max(xMin, Math.min(xMax, xW));
        }
        // 起点设在 island 顶部外侧 (避免管线穿入 island 体内)
        const startRaw = new THREE.Vector3(xW, (d._top||10)+1.5, dz);
        const rawEnd = new THREE.Vector3(yearToX(w.y), band.position.y, band.position.z);
        const color = 0xff3030;
        const haloColor = 0xff8a8a;
        // 箭头尺寸
        const TIP_H = 2.6;
        const TIP_R = 0.95;
        // 将两端从中心回退到表面外缘,避免穿透
        const SURFACE = 1.4;
        const rawDir = new THREE.Vector3().subVectors(rawEnd, startRaw).normalize();
        const start = startRaw.clone().addScaledVector(rawDir, SURFACE);
        // 弧线终点比 cone 底端再退一格,让管子不会穿过 cone
        const tipBaseCenter = rawEnd.clone().addScaledVector(rawDir, -SURFACE);    // cone 锥尖位置(贴在 band 表面)
        const end = tipBaseCenter.clone().addScaledVector(rawDir, -TIP_H);          // 管线末端 = cone 底盘中心
        // 上拱弧线 - 充分抬高,完全跨过任何岛屿(岛屿统一高度 12,弧顶至少到 25+)
        const peakY = Math.max(start.y, end.y) + 14;
        const mid = new THREE.Vector3(xW, peakY, (start.z+end.z)/2);
        const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
        // 外层粗描边(半透明发光)
        const halo = new THREE.Mesh(
          new THREE.TubeGeometry(curve, 32, 0.55, 10, false),
          new THREE.MeshBasicMaterial({color:haloColor, transparent:true, opacity:0.35, depthWrite:false})
        );
        halo.userData = {kind:'war', year:w.y, from:dynName, to:opp, desc:w.t, dynasty:dynName, isHan:true};
        scene.add(halo); allPickable.push(halo); warBeams.push({mesh:halo, year:w.y, isHan:true});
        // 内层实心粗管
        const tube = new THREE.TubeGeometry(curve, 32, 0.32, 10, false);
        const mat  = new THREE.MeshBasicMaterial({color, transparent:false, opacity:1.0});
        const arc  = new THREE.Mesh(tube, mat);
        arc.userData = halo.userData;
        scene.add(arc); allPickable.push(arc); warBeams.push({mesh:arc, year:w.y, isHan:true});

        // 末端箭头 — 沿曲线末端真实切线方向,锥尖刚好触及 band 表面
        // 曲线末端的切线 (从 t=0.96 到 t=1.0)
        const tipDir = new THREE.Vector3().subVectors(curve.getPoint(1.0), curve.getPoint(0.96)).normalize();
        const tip = new THREE.Mesh(
          new THREE.ConeGeometry(TIP_R, TIP_H, 12),
          new THREE.MeshBasicMaterial({color, depthTest:false, depthWrite:false, transparent:true})
        );
        // ConeGeometry 默认底盘在 -y/2,锥尖在 +y/2; 把锥尖对齐到 tipBaseCenter (band 表面)
        // 即 cone 中心 = tipBaseCenter - tipDir * (TIP_H/2)
        tip.position.copy(tipBaseCenter).addScaledVector(tipDir, -TIP_H/2);
        tip.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), tipDir);
        tip.renderOrder = 999;
        tip.userData = halo.userData;
        scene.add(tip); allPickable.push(tip);
        warBeams.push({mesh:tip, year:w.y, isHan:true, pulse:true});

        // 起点也加个小六边形发光块,强化"从汉族出发"的视觉
        const origin = new THREE.Mesh(
          new THREE.OctahedronGeometry(0.7, 0),
          new THREE.MeshBasicMaterial({color:0xfff2a0})
        );
        origin.position.copy(start);
        origin.userData = halo.userData;
        scene.add(origin);
        warBeams.push({mesh:origin, year:w.y, isHan:true});

        // 年份大标:加描边背板
        const yrLbl = '⚔ ' + (w.y<0?'前'+(-w.y):''+w.y);
        const txt = makeTextSprite(yrLbl, '#ffd0d0', 16);
        txt.position.copy(mid); txt.position.y += 1.4;
        txt.userData = halo.userData;
        scene.add(txt);
        warBeams.push({mesh:txt, year:w.y, isHan:true});
      });
    });
  });
}

/* 少数民族吞并箭头: 副线 A → 副线 B (加粗描边+大箭头+背板年份) */
let annexArrows = [];
function buildAnnexArrows(){
  ANNEXATIONS.forEach(a=>{
    const A = minorityIndex.get(a.by);
    let B = minorityIndex.get(a.target);
    const xW = yearToX(a.y);

    // 起点
    let startRaw;
    if(A){
      startRaw = new THREE.Vector3(xW, A.position.y, A.position.z);
    } else {
      const d = DYNASTIES.find(d=>d.name===a.by);
      if(d){
        let xClamped = xW;
        if(typeof d._cx==='number' && typeof d._len==='number'){
          const half = d._len/2;
          xClamped = Math.max(d._cx-half+0.4, Math.min(d._cx+half-0.4, xW));
        }
        startRaw = new THREE.Vector3(xClamped, (d._top||10)+1.5, d._cz||0);
      }
      else  { startRaw = new THREE.Vector3(xW, 12, 0); }
    }

    // 终点: B 为少数民族 band -> 用 band 位置; 否则尝试找朝代 (target 为汉族王朝时)
    let end_raw, targetIsDyn=false, targetDyn=null;
    if(B){
      end_raw = new THREE.Vector3(xW, B.position.y, B.position.z);
    } else {
      targetDyn = DYNASTIES.find(d=>d.name===a.target);
      if(targetDyn){
        targetIsDyn = true;
        let xC = xW;
        if(typeof targetDyn._cx==='number' && typeof targetDyn._len==='number'){
          const half = targetDyn._len/2;
          xC = Math.max(targetDyn._cx-half+0.4, Math.min(targetDyn._cx+half-0.4, xW));
        }
        // 终点设在岛屿"顶部表面"上方 1.5,而不是岛屿内部
        end_raw = new THREE.Vector3(xC, (targetDyn._top||10)+1.5, targetDyn._cz||0);
      } else {
        return; // 真找不到目标
      }
    }

    const color    = A ? 0xff9020 : 0xff3030;   // 少→少 鲜橙;汉灭少 鲜红
    const haloCol  = A ? 0xffd080 : 0xff8a8a;
    const ARR_H = 3.0;
    const ARR_R = targetIsDyn ? 1.35 : 1.1;
    const rawDir = new THREE.Vector3().subVectors(end_raw, startRaw).normalize();
    const SURFACE = 1.4;
    const start = startRaw.clone().addScaledVector(rawDir, SURFACE);
    // cone 锥尖位置 = 目标表面外侧;管线终点 = cone 底盘中心
    const tipBaseCenter = end_raw.clone().addScaledVector(rawDir, -SURFACE);
    const end = tipBaseCenter.clone().addScaledVector(rawDir, -ARR_H);
    // 弧顶充分抬高 - 跨过任何岛屿(岛屿统一高度 12 -> 顶部 ~13,弧顶到 27+)
    const peakY = Math.max(start.y, end.y) + 14;
    const mid = new THREE.Vector3(xW, peakY, (start.z+end.z)/2);
    const curve = new THREE.QuadraticBezierCurve3(start, mid, end);

    // 外圈发光描边
    const halo = new THREE.Mesh(
      new THREE.TubeGeometry(curve, 28, 0.6, 10, false),
      new THREE.MeshBasicMaterial({color:haloCol, transparent:true, opacity:0.4, depthWrite:false})
    );
    halo.userData = {kind:'annex', year:a.y, by:a.by, target:a.target, desc:a.desc, isAnnex:true};
    scene.add(halo); allPickable.push(halo); annexArrows.push({mesh:halo, year:a.y});

    // 内层实心粗管
    const tube = new THREE.TubeGeometry(curve, 28, 0.38, 10, false);
    const mat  = new THREE.MeshBasicMaterial({color});
    const arc  = new THREE.Mesh(tube, mat);
    arc.userData = halo.userData;
    scene.add(arc); allPickable.push(arc); annexArrows.push({mesh:arc, year:a.y});

    // 箭头锥 - 沿曲线末端真实切线方向,锥尖严格落在 tipBaseCenter
    const tipDir = new THREE.Vector3().subVectors(curve.getPoint(1.0), curve.getPoint(0.96)).normalize();
    const arrowMat = new THREE.MeshBasicMaterial({
      color,
      depthTest: false,            // 始终可见,任何指向都不被遮挡
      depthWrite: false,
      transparent: true
    });
    const arrow = new THREE.Mesh(
      new THREE.ConeGeometry(ARR_R, ARR_H, 14),
      arrowMat
    );
    // 锥尖对准 tipBaseCenter (位于 +y 方向),所以 cone 中心 = tipBaseCenter - tipDir*(ARR_H/2)
    arrow.position.copy(tipBaseCenter).addScaledVector(tipDir, -ARR_H/2);
    arrow.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), tipDir);
    arrow.renderOrder = 999;
    arrow.userData = halo.userData;
    scene.add(arrow); allPickable.push(arrow);
    annexArrows.push({mesh:arrow, year:a.y, pulse:true});

    // 指向汉族岛屿时,在岛屿顶部再加一个 ✕ / 圆环标记,作为命中点的清晰提示
    if(targetIsDyn){
      // 命中圆环
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0xff3030, transparent:true, opacity:0.9,
        depthTest:false, depthWrite:false, side:THREE.DoubleSide
      });
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(1.4, 1.9, 24),
        ringMat
      );
      ring.position.copy(end_raw);
      ring.position.y -= 0.3;
      ring.lookAt(end_raw.x, end_raw.y+10, end_raw.z); // 朝上
      ring.renderOrder = 998;
      ring.userData = halo.userData;
      scene.add(ring); allPickable.push(ring);
      annexArrows.push({mesh:ring, year:a.y, pulse:true});

      // 中心十字标记
      const dotMat = new THREE.MeshBasicMaterial({
        color: 0xfff0c0, depthTest:false, depthWrite:false
      });
      const dot = new THREE.Mesh(
        new THREE.SphereGeometry(0.45, 12, 10), dotMat
      );
      dot.position.copy(end_raw);
      dot.renderOrder = 999;
      dot.userData = halo.userData;
      scene.add(dot); allPickable.push(dot);
      annexArrows.push({mesh:dot, year:a.y});
    }

    // 起点小标识(被动方那侧不显示)
    if(A){
      const tag = new THREE.Mesh(
        new THREE.SphereGeometry(0.5,10,8),
        new THREE.MeshBasicMaterial({color})
      );
      tag.position.copy(start);
      scene.add(tag);
      annexArrows.push({mesh:tag, year:a.y});
    }

    // 中点醒目大标签 "前209 匈奴吞并东胡"
    const yrTxt = a.y<0?'前'+(-a.y):''+a.y;
    const lab = makeTextSprite(`${yrTxt}  ${a.by} 吞并 ${a.target}`, '#ffe0a0', 15);
    lab.position.copy(mid); lab.position.y += 1.6;
    scene.add(lab);
    annexArrows.push({mesh:lab, year:a.y});
  });
}

  }
}


function makeTextSprite(text,color='#fff',fontSize=22, opts={}){
  const c = document.createElement('canvas');
  const pad = 10;
  const ctx = c.getContext('2d');
  ctx.font = `bold ${fontSize}px "PingFang SC","Microsoft YaHei",sans-serif`;
  const m = ctx.measureText(text);
  c.width = Math.ceil(m.width)+pad*2;
  c.height = fontSize+pad*2;
  ctx.font = `bold ${fontSize}px "PingFang SC","Microsoft YaHei",sans-serif`;
  // 如果调用方需要"被挡住才不可见",绘制一层半透明深色底,把文字本身的描边和背景一起做出来,
  // 这样即便 depthTest 开启,文字也保持高对比、易读
  if(opts.bg){
    ctx.fillStyle = 'rgba(8,12,22,0.78)';
    // 圆角矩形底
    const r=6;
    ctx.beginPath();
    ctx.moveTo(r,0); ctx.lineTo(c.width-r,0); ctx.quadraticCurveTo(c.width,0,c.width,r);
    ctx.lineTo(c.width,c.height-r); ctx.quadraticCurveTo(c.width,c.height,c.width-r,c.height);
    ctx.lineTo(r,c.height); ctx.quadraticCurveTo(0,c.height,0,c.height-r);
    ctx.lineTo(0,r); ctx.quadraticCurveTo(0,0,r,0); ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = color;
  ctx.textBaseline = 'middle';
  ctx.shadowColor='rgba(0,0,0,.95)'; ctx.shadowBlur=8;
  ctx.fillText(text, pad, c.height/2);
  const tex = new THREE.CanvasTexture(c); tex.minFilter=THREE.LinearFilter;
  // depthTest 默认开启:被前面的岛屿挡住时文字不再"透显",防止视觉错位看错朝代
  const depthTest = (opts.depthTest !== false);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest, depthWrite:false}));
  const sc = 0.06;
  sp.scale.set(c.width*sc, c.height*sc, 1);
  return sp;
}

/* ===================== 交互 ===================== */
function onResize(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
function onPointerMove(e){
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y = -((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(allPickable);
  const tip = document.getElementById('tip');
  const war = hits.find(h=>h.object.userData.kind==='war');
  const annex = hits.find(h=>h.object.userData.kind==='annex');
  const minority = hits.find(h=>h.object.userData.kind==='minority');
  const island = hits.find(h=>h.object.userData.kind==='island');
  if(war){
    const u=war.object.userData;
    const yr=u.year<0?'前'+(-u.year):''+u.year;
    tip.innerHTML=`<span class="y">${yr} 年</span><span class="f">${u.from}</span> ⚔ <span class="f">${u.to}</span><br/><span style="color:#cbd2e2;font-size:11px">${u.desc||''}</span>`;
    tip.style.display='block';
    tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+14)+'px';
  } else if(annex){
    const u=annex.object.userData;
    const yr=u.year<0?'前'+(-u.year):''+u.year;
    tip.innerHTML=`<span class="y">${yr} 年 吞并</span><span class="f">${u.by}</span> → <span class="f">${u.target}</span><br/><span style="color:#cbd2e2;font-size:11px">${u.desc||''}</span>`;
    tip.style.display='block';
    tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+14)+'px';
  } else if(minority){
    const u=minority.object.userData;
    const life = `${u.life[0]<0?'前'+(-u.life[0]):u.life[0]} ~ ${u.life[1]}`;
    tip.innerHTML=`<span class="y">少数民族</span> ${u.name}<br/><span style="color:#9aa3b8;font-size:11px">${life} · 点击查看详情</span>`;
    tip.style.display='block';
    tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+14)+'px';
  } else if(island){
    const u=island.object.userData;
    tip.innerHTML=`<span class="y">朝代</span> ${u.name}<br/><span style="color:#9aa3b8;font-size:11px">点击查看详情</span>`;
    tip.style.display='block';
    tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+14)+'px';
  } else {
    tip.style.display='none';
  }
}
function onClick(){
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(allPickable);
  if(!hits.length) return;
  const u = hits[0].object.userData;
  if(u.kind==='island') showDynasty(u.idx);
  else if(u.kind==='war'){
    const dIdx = DYNASTIES.findIndex(d=>d.name===u.dynasty);
    if(dIdx>=0){ showDynasty(dIdx); currentTab='war'; setActiveTab('war'); renderTimeline(DYNASTIES[dIdx], 'war'); }
  } else if(u.kind==='minority'){
    showMinority(u.name);
  } else if(u.kind==='annex'){
    showMinority(u.target);
  }
}

/* 少数民族详情面板 */
function showMinority(name){
  const m = MINORITIES.find(x=>x.name===name);
  if(!m) return;
  // 关闭汉族面板
  document.getElementById('panel').classList.remove('show');
  const mp = document.getElementById('minority-panel');
  document.getElementById('mp-title').innerHTML = withRuby(m.name);
  const lifeStr = `${m.life[0]<0?'前'+(-m.life[0]):m.life[0]} ~ ${m.life[1]}`;
  const typeLabel = {north:'北方游牧',northeast:'东北渔猎',west:'西部政权',south:'南方政权',mixed:'综合'}[m.type]||m.type;
  document.getElementById('mp-meta').textContent = `${typeLabel}  ·  ${lifeStr}`;
  document.getElementById('mp-desc').textContent = m.desc||'暂无详细描述。';

  // 相关战争:从所有朝代 wars 中筛选与本族相关的
  const warsDiv = document.getElementById('mp-wars');
  warsDiv.innerHTML='';
  DYNASTIES.forEach(d=>{
    d.wars.forEach(w=>{
      const facs = w.factions||[];
      if(facs.includes(m.name)){
        const yr = w.y<0?'前'+(-w.y):''+w.y;
        const others = facs.filter(f=>f!==m.name).join('、');
        const el = document.createElement('div'); el.className='mp-item';
        el.innerHTML=`<span class="yr">${yr}年</span> <span class="parties">${m.name} ⚔ ${others}</span> <span style="color:#9aa3b8">[${d.name}]</span><br/><span style="color:#aeb8cc">${annotatePeople(w.t)}</span>`;
        warsDiv.appendChild(el);
      }
    });
  });
  if(!warsDiv.children.length) warsDiv.innerHTML='<div class="mp-item" style="color:#666">暂无记录</div>';

  // 相关吞并
  const annexDiv = document.getElementById('mp-annex');
  annexDiv.innerHTML='';
  ANNEXATIONS.forEach(a=>{
    if(a.by===m.name || a.target===m.name){
      const yr = a.y<0?'前'+(-a.y):''+a.y;
      const role = a.by===m.name ? '<span style="color:#ff9a5a">吞并方</span>' : '<span style="color:#7ad0ff">被吞并方</span>';
      const el = document.createElement('div'); el.className='mp-item';
      el.innerHTML=`<span class="yr">${yr}年</span> <span class="parties">${a.by} 吞并 ${a.target}</span> ${role}<br/><span style="color:#aeb8cc">${annotatePeople(a.desc)}</span>`;
      annexDiv.appendChild(el);
    }
  });
  if(!annexDiv.children.length) annexDiv.innerHTML='<div class="mp-item" style="color:#666">暂无记录</div>';

  mp.classList.add('show');

  // 镜头平移到该族条带(保持当前角度,不旋转)
  const band = minorityIndex.get(m.name);
  if(band){
    const pos = band.position;
    panToTarget({x:pos.x, y:pos.y, z:pos.z});
  }
}

function showDynasty(i){
  document.getElementById('minority-panel').classList.remove('show');
  activeDynastyIdx=i;
  const d=DYNASTIES[i];
  document.getElementById('p-title').innerHTML=withRuby(d.name);
  document.getElementById('p-meta').textContent=d.yearLabel;
  const tb=document.getElementById('p-tribes'); tb.innerHTML='';
  (d.tribes||[]).forEach(t=>{
    const tp = TRIBE_TYPE[t]||'west';
    const c = TYPE_COLOR[tp]||0xffffff;
    const sp=document.createElement('span'); sp.className='tag'; sp.innerHTML=withRuby(t);
    sp.style.color='#'+c.toString(16).padStart(6,'0');
    tb.appendChild(sp);

/* 把文本中所有匹配到 PEOPLE 主名或别名的子串包裹成人物徽章 */
const ROLE_ICON = {emperor:'♕', general:'⚔', advisor:'✦', envoy:'✉', tribe:'⚑'};
const ROLE_LABEL = {emperor:'帝王', general:'主将', advisor:'谋臣', envoy:'使节', tribe:'少数民族首领'};
function annotatePeople(text){
  let html = escapeHtml(text);
  const cands = [...Object.keys(PEOPLE), ...Object.keys(PERSON_ALIAS)]
                .sort((a,b)=>b.length-a.length);
  // 记录已经被包裹过的区间,避免别名是主名子串导致嵌套标记
  const marks = []; // [start, end]
  cands.forEach(name=>{
    if(!name) return;
    const target = PERSON_ALIAS[name] || name;
    const info = PEOPLE[target]; if(!info) return;
    // 用循环扫描,跳过已落在标记内的位置
    let result = '';
    let i = 0;
    const len = html.length;
    const nlen = name.length;
    while(i < len){
      // 检查当前位置是否已在标记区间内
      let inMark = false;
      for(const [s,e] of marks){
        if(i >= s && i < e){ inMark = true; break; }
      }
      if(!inMark && html.substr(i, nlen) === name){
        const wrapped = `\x01${target}\x02${name}\x03`;
        const newStart = result.length;
        result += wrapped;
        // 更新已有 marks 的偏移?这里 marks 基于旧 html 索引,改为基于新 result 重建
        i += nlen;
        marks.push([newStart, newStart + wrapped.length]);
      } else {
        result += html[i];
        i++;
      }
    }
    // 重建 marks 索引,使其指向新 html 中的位置
    // 简化:每轮重新扫描整个新串收集所有 \x01...\x03 区间
    html = result;
    marks.length = 0;
    let p = 0;
    while(p < html.length){
      const a = html.indexOf('\x01', p);
      if(a < 0) break;
      const b = html.indexOf('\x03', a);
      if(b < 0) break;
      marks.push([a, b+1]);
      p = b+1;
    }
  });
  html = html.replace(/\x01([^\x02\x01]+)\x02([^\x03\x01]+)\x03/g,(m,target,label)=>{
    const info = PEOPLE[target];
    if(!info) return label; // 防御性回退
    const icon = ROLE_ICON[info.role] || '·';
    return `<span class="person ${info.role}" data-person="${target}" data-icon="${icon}">${withRuby(label)}</span>`;
  });
  // 清理任何残留的控制字符,避免脏字符显示
  html = html.replace(/[\x01\x02\x03]/g, '');
  return html;
}

function renderTimeline(d, tab){
  const items=[];
  if(tab==='all'||tab==='relation') d.relations.forEach(r=>items.push({y:r.y,_y:parseY(r.y),t:r.t,type:'relation'}));
  if(tab==='all'||tab==='event')    d.events.forEach(r=>items.push({y:r.y,_y:parseY(r.y),t:r.t,type:'event'}));
  if(tab==='all'||tab==='war')      d.wars.forEach(r=>{const ny=parseY(r.y); items.push({y:(ny<0?'前'+(-ny):''+ny),_y:ny,t:r.t,type:'war',factions:r.factions});});
  if(tab==='people'){
    // 抽取所有出现在该朝代事件文本中的人物
    const found = new Set();
    const allText = [...d.relations,...d.events,...d.wars].map(x=>x.t).join(' ');
    [...Object.keys(PEOPLE),...Object.keys(PERSON_ALIAS)].forEach(n=>{
      if(allText.indexOf(n)>=0) found.add(PERSON_ALIAS[n]||n);
    });
    const box=document.getElementById('p-timeline'); box.innerHTML='';
    [...found].forEach(name=>{
      const p=PEOPLE[name]; if(!p) return;
      const div=document.createElement('div'); div.className='tl-item '+(p.role==='emperor'?'event':p.role==='general'?'war':'relation');
      div.innerHTML=`<span class="yr">${escapeHtml(p.life)}</span><span class="person ${p.role}" data-person="${name}" data-icon="${ROLE_ICON[p.role]||'·'}">${withRuby(name)}</span>
        <div class="factions" style="margin-top:6px;color:#cbd2e2">${escapeHtml(p.desc)}</div>`;
      box.appendChild(div);
    });
    if(!found.size) box.innerHTML='<div style="color:#9aa3b8;font-size:12px;padding:6px 0">未识别人物</div>';
    return;
  }
  items.sort((a,b)=>a._y-b._y);
  const box=document.getElementById('p-timeline'); box.innerHTML='';
  items.forEach(it=>{
    const div=document.createElement('div'); div.className='tl-item '+it.type;
    let html=`<span class="yr">${escapeHtml(it.y)}</span><span class="txt">${annotatePeople(it.t)}</span>`;
    if(it.type==='war' && it.factions){
      const fac = it.factions.map(f=>`<span class="f">${escapeHtml(f)}</span>`).join(' ⚔ ');
      html += `<div class="factions">参战：${fac}</div>`;
    }
    div.innerHTML=html;
    box.appendChild(div);
  });
  if(!items.length) box.innerHTML='<div style="color:#9aa3b8;font-size:12px;padding:6px 0">暂无该类型内容</div>';
}

function parseY(s){
  const m=String(s).match(/前?(\d+)/);
  if(!m) return 0;
  const n=parseInt(m[1]);
  return String(s).startsWith('前')?-n:n;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);}

/* 拼音注音工具 - 词组优先匹配,回退逐字 */
function hasPinyin(text){
  if(!text) return false;
  const s=String(text);
  if(typeof PINYIN_PHRASE!=='undefined' && PINYIN_PHRASE[s]) return true;
  if(typeof PINYIN==='undefined') return false;
  for(const ch of s){ if(PINYIN[ch]) return true; }
  return false;
}
function getPinyin(text){
  if(!text) return '';
  const s=String(text);
  if(typeof PINYIN_PHRASE!=='undefined' && PINYIN_PHRASE[s]) return PINYIN_PHRASE[s];
  if(typeof PINYIN==='undefined') return '';
  const parts=[];
  for(const ch of s){ if(PINYIN[ch]) parts.push(PINYIN[ch]); }
  return parts.join(' ');
}
/*
 * withRuby(text):
 * 1. 若整个 text 在 PINYIN_PHRASE 里命中 -> 按空格分割拼音,逐字配对生成 ruby
 * 2. 否则尝试贪心最长匹配 PINYIN_PHRASE 子串 -> 匹配段按词组注音,非匹配段逐字查 PINYIN
 * 3. 未命中的字原样输出(转义)
 */
function withRuby(text){
  if(!text) return '';
  const s = String(text);
  if(typeof PINYIN==='undefined' && typeof PINYIN_PHRASE==='undefined') return escapeHtml(s);

  // 构建词组列表,按长度降序(贪心最长匹配)
  const phrases = (typeof PINYIN_PHRASE!=='undefined') ? Object.keys(PINYIN_PHRASE).sort((a,b)=>b.length-a.length) : [];

  let out = '';
  let i = 0;
  while(i < s.length){
    // 尝试最长词组匹配
    let matched = false;
    for(const ph of phrases){
      if(s.substr(i, ph.length) === ph){
        // 匹配到词组,按空格分割拼音逐字配对
        const pys = PINYIN_PHRASE[ph].split(/\s+/);
        const chars = [...ph]; // 支持多字节
        for(let j=0;j<chars.length;j++){
          const py = pys[j] || '';
          if(py){
            out += '<ruby>'+escapeHtml(chars[j])+'<rt>'+py+'</rt></ruby>';
          } else {
            out += escapeHtml(chars[j]);
          }
        }
        i += ph.length;
        matched = true;
        break;
      }
    }
    if(!matched){
      const ch = s[i];
      if(typeof PINYIN!=='undefined' && PINYIN[ch]){
        out += '<ruby>'+escapeHtml(ch)+'<rt>'+PINYIN[ch]+'</rt></ruby>';
      } else {
        out += escapeHtml(ch);
      }
      i++;
    }
  }
  return out;
}

/* 人物词卡 hover - 增强版:补 相关事件 / 同朝代相关人物 */
const pcEl = document.getElementById('person-card');

// 查找该人物出现在哪些朝代的 wars/events/relations
function findPersonEvents(name, p){
  const alias = Object.keys(PERSON_ALIAS).filter(a=>(PERSON_ALIAS[a]||a)===name);
  const keys = [name, ...alias];
  const out = [];
  DYNASTIES.forEach(d=>{
    const buckets = [
      {arr:d.relations||[], type:'关系'},
      {arr:d.events||[],    type:'事件'},
      {arr:d.wars||[],      type:'战争'}
    ];
    buckets.forEach(b=>{
      b.arr.forEach(it=>{
        if(keys.some(k=>String(it.t).indexOf(k)>=0)){
          out.push({y:it.y, t:it.t, type:b.type, dyn:d.name});
        }
      });
    });
  });
  // 去重 + 按年份
  const seen=new Set();
  return out.filter(o=>{const k=o.y+'|'+o.t;if(seen.has(k))return false;seen.add(k);return true;})
            .sort((a,b)=>{
              const pa=String(a.y).replace('前','-').replace(/[^\-\d]/g,'');
              const pb=String(b.y).replace('前','-').replace(/[^\-\d]/g,'');
              return (parseInt(pa)||0)-(parseInt(pb)||0);
            });
}

// 查找同朝代的其他人物(同角色优先)
function findRelatedPeople(name, p){
  const peers = Object.entries(PEOPLE)
    .filter(([n,info])=>n!==name && info.dyn===p.dyn)
    .map(([n,info])=>({n,info}));
  // 同 role 优先
  peers.sort((a,b)=>{
    const sa = (a.info.role===p.role)?0:1;
    const sb = (b.info.role===p.role)?0:1;
    return sa-sb;
  });
  return peers.slice(0,6);
}

    islands.forEach(isl=>{
      const u=isl.userData;
      const inYear = !(u.y1 < yMin || u.y0 > yMax);
      const inDyn  = !hasSel || selectedIdxSet.has(u.idx);
      const vis = inYear && inDyn;
      isl.visible = vis;
      if(u.deco) u.deco.visible = vis;
    });
    // 少数民族副线
    tribeFlags.forEach(b=>{
      const u=b.userData;
      if(u.kind!=='minority') return;
      const inYear = !(u.life[1] < yMin || u.life[0] > yMax);
      const inDyn = !hasSel || facs.has(u.name);
      b.visible = showTribes && inYear && inDyn;
    });
    // 战争连线
    warBeams.forEach(wb=>{
      const u=wb.mesh.userData||{};
      const yr = wb.year;
      const inYear = (yr>=yMin && yr<=yMax);
      const inDyn  = !hasSel || (u.dynasty && selectedNameSet.has(u.dynasty));
      wb.mesh.visible = showWars && inYear && inDyn;
    });
    // 吞并箭头
    annexArrows.forEach(ab=>{
      const u=ab.mesh.userData||{};
      const yr = ab.year;
      const inYear = (yr>=yMin && yr<=yMax);
      let inDyn = true;
      if(hasSel){
        inDyn = (u.by && facs.has(u.by)) || (u.target && facs.has(u.target));
      }
      ab.mesh.visible = showAnnex && inYear && inDyn;
    });
  }
  yrMin.oninput = yrMax.oninput = ()=>{ refreshYrDisplay(); applyFilter(); };
  document.getElementById('btn-clear-filter').onclick = ()=>{
    activeDynFilter=-1;
    activeGroupFilter=null;
    clearAllActiveBtn();
    yrMin.value=-280; yrMax.value=1912;
    refreshYrDisplay(); applyFilter();
  };
  refreshYrDisplay();
}

function tweenCamera(toPos,toTarget,dur=900){
  const sP=camera.position.clone(), sT=controls.target.clone();
  const start=performance.now();
  function step(now){
    const t=Math.min(1,(now-start)/dur);
    const e=t<.5?2*t*t:-1+(4-2*t)*t;
    camera.position.lerpVectors(sP,new THREE.Vector3(toPos.x,toPos.y,toPos.z),e);
    controls.target.lerpVectors(sT,new THREE.Vector3(toTarget.x,toTarget.y,toTarget.z),e);
    controls.update();
    if(t<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* 仅平移视角:保持当前相机相对 target 的偏移(角度/距离不变),把 target 平移到 toTarget。
   用于点击朝代按钮时只居中,不旋转。 */
function panToTarget(toTarget, dur=700){
  const sT = controls.target.clone();
  const sP = camera.position.clone();
  const dest = new THREE.Vector3(toTarget.x, toTarget.y, toTarget.z);
  const delta = dest.clone().sub(sT);
  const destP = sP.clone().add(delta);
  const start = performance.now();
  function step(now){
    const t = Math.min(1, (now-start)/dur);
    const e = t<.5 ? 2*t*t : -1+(4-2*t)*t;
    camera.position.lerpVectors(sP, destP, e);
    controls.target.lerpVectors(sT, dest, e);
    controls.update();
    if(t<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* 居中 + 放大:方向不变,按目标尺寸把相机距离收到 zoomDist。 */
function panAndZoomToTarget(toTarget, zoomDist=70, dur=750){
  const sT = controls.target.clone();
  const sP = camera.position.clone();
  const dest = new THREE.Vector3(toTarget.x, toTarget.y, toTarget.z);
  // 保持方向:取当前 camera→target 的单位向量,反向乘 zoomDist 得到 destP
  let dir = sP.clone().sub(sT);
  if(dir.lengthSq() < 1e-6) dir.set(0,1,0.0001); // 退化时给一个默认俯视
  dir.normalize();
  const destP = dest.clone().addScaledVector(dir, zoomDist);
  const start = performance.now();
  function step(now){
    const t = Math.min(1, (now-start)/dur);
    const e = t<.5 ? 2*t*t : -1+(4-2*t)*t;
    camera.position.lerpVectors(sP, destP, e);
    controls.target.lerpVectors(sT, dest, e);
    controls.update();
    if(t<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* 朝代浮岛高亮:目标朝代 emissive 调亮,其它复原。 */
const HL_BASE_EI = 0.22;   // 原始自发光强度
const HL_PEAK_EI = 0.55;   // 高亮自发光强度(温和,不刺眼)
function highlightDynasty(idx){
  islands.forEach(isl=>{
    if(!isl.material || !isl.material.emissive) return;
    const isSel = (idx>=0 && isl.userData.idx===idx);
    isl.material.emissiveIntensity = isSel ? HL_PEAK_EI : HL_BASE_EI;
    if(isl.userData.deco){
      // 旗杆/环带轻微亮一点;标签 sprite 不变
      isl.userData.deco.children.forEach(ch=>{
        if(ch.material && ch.material.color && !ch.isSprite){
          if(isSel){
            ch.material.opacity = Math.min(1, (ch.material.opacity||1)*1.0);
          }
        }
      });
    }
  });
}
function clearHighlight(){ highlightDynasty(-1); }

function animate(){
  requestAnimationFrame(animate);
  const t = performance.now()*0.001;
  if(starGroup) starGroup.rotation.y += 0.00015;
  // 副线条带轻微呼吸
  tribeFlags.forEach((g,i)=>{
    if(!g.material || !g.material.emissiveIntensity && g.material.emissiveIntensity!==0) return;
    g.material.emissiveIntensity = 0.45 + 0.18*Math.sin(t*1.2 + i*0.7);
  });
  // 战争光柱脉冲
  warBeams.forEach(b=>{
    if(b.pulse && b.mesh.scale){
      const s = 1+0.3*Math.sin(t*3+b.year);
      b.mesh.scale.setScalar(s);
    }
  });
  // 吞并箭头脉冲
  annexArrows.forEach(b=>{
    if(b.pulse && b.mesh.scale){
      const s = 1+0.25*Math.sin(t*2.5+b.year*0.01);
      b.mesh.scale.setScalar(s);
    }
  });
  // 河面荧光偏移(简单旋转)
  scene.children.forEach(c=>{
    if(c.userData && c.userData.kind==='river_dust'){
      c.rotation.y += 0.0005;
    }
  });
  // 巡游模式:镜头绕场景缓慢转
  if(tourMode){
    tourAngle += 0.002;
    const r=160;
    camera.position.x = Math.cos(tourAngle)*r;
    camera.position.z = Math.sin(tourAngle)*r;
    camera.position.y = 70+Math.sin(tourAngle*0.5)*20;
    controls.target.set(0,5,0);
  }
  controls.update();
  renderer.render(scene, camera);
}

addEventListener('load', ()=>{
  if(typeof THREE==='undefined'||!THREE.OrbitControls){
    document.getElementById('loading').textContent='Three.js 加载失败，请检查网络后刷新';
    return;
  }
  if(typeof DYNASTIES==='undefined'){
    document.getElementById('loading').textContent='数据文件加载失败 (DYNASTIES 未定义），请确认 dynasty_data.js 与 HTML 在同一目录';
    return;
  }
  init();
});
window.addEventListener('error', function(e){
  const el = document.getElementById('loading');
  if(el && !el.classList.contains('hidden')){
    el.style.flexDirection='column';
    el.style.padding='20px';
    el.style.textAlign='left';
    el.innerHTML = '<div style="color:#ff6b6b;font-size:16px;margin-bottom:8px">JS 错误</div>'
      + '<div style="color:#aaa;font-size:12px;max-width:80vw;word-break:break-all">'
      + (e.message||'unknown') + ' @ ' + (e.filename||'') + ':' + (e.lineno||'') + '</div>';
  }
});
