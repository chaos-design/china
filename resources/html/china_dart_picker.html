<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- 关键：禁止浏览器发送 Referer。DataV(geo.datav.aliyun.com) 的边缘节点会对带有
     非白名单 Referer 的请求返回 403——单独以 file:// 打开 HTML 时浏览器会附带 Referer，
     从而触发 403。设为 no-referrer 后所有请求都不带 Referer（实测 DataV 无 Referer 时返回 200，
     Esri 卫星瓦片无 Referer 同样正常），既保留官方行政区划数据又彻底消除 403。 -->
<meta name="referrer" content="no-referrer" />
<title>中国随机旅行目的地选择器</title>

<!-- Leaflet：卫星瓦片底图 + 官方行政边界矢量叠加（CDN 引入） -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  /* ============ 全局基础样式 ============ */
  :root{
    --bg1:#0b1026; --bg2:#1a1140; --accent:#ffcc33; --accent2:#ff5d73;
    --land:#2b3a67; --land-hi:#ff8a3d; --text:#eef2ff; --muted:#9aa6d6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;width:100%;max-width:100%;overflow-x:hidden;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);
    overscroll-behavior-x:none;}
  body{
    background:radial-gradient(1200px 800px at 70% -10%,#27205e 0%,var(--bg2) 40%,var(--bg1) 100%);
    overflow:hidden;position:fixed;inset:0;
  }
  /* 顶部标题 */
  header{
    position:fixed;top:0;left:0;right:0;z-index:30;
    padding:14px 22px;display:flex;align-items:center;gap:14px;
    background:linear-gradient(180deg,rgba(8,10,30,.85),rgba(8,10,30,0));
    pointer-events:none;
  }
  header h1{font-size:20px;margin:0;letter-spacing:1px;}
  header .sub{font-size:12px;color:var(--muted);}

  /* 主舞台：全屏地图 + 底部功能区 */
  #stage{position:relative;width:100%;height:100%;overflow:hidden;}
  /* 关键：#mapWrap 自建层叠上下文（z-index:1），把 Leaflet 内部窗格/控件
     （z-index 高达 1000）全部约束在本容器内，避免其溢出到根层叠层
     遮挡底部功能栏与「选取」按钮（修复选取被遮挡无法点击的故障）。 */
  #mapWrap{position:absolute;inset:0;z-index:1;overflow:hidden;}
  #map{width:100%;height:100%;background:#0b1026;}
  /* Leaflet 控件避让顶部标题与底部功能栏 */
  .leaflet-control-zoom{margin-top:64px !important;}
  .leaflet-container{background:#0b1026;}

  /* ============ 地图加载中（Loading）遮罩 ============ */
  #loading{
    position:absolute;inset:0;z-index:2000;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:radial-gradient(900px 600px at 50% 40%,rgba(39,32,94,.55),rgba(11,16,38,.92));
    backdrop-filter:blur(2px);color:var(--text);transition:opacity .45s ease;
  }
  #loading.hide{opacity:0;pointer-events:none;}
  #loading .spinner{
    width:48px;height:48px;border-radius:50%;
    border:4px solid rgba(255,255,255,.18);border-top-color:var(--accent);
    animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  #loading .ltext{font-size:14px;letter-spacing:1px;color:var(--accent);}
  #loading .lsub{font-size:12px;color:var(--muted);}

  /* 行政区/省会标注（divIcon 文本标签，随地图缩放定位、不随缩放变形） */
  .map-label{font-size:11px;color:#eef6ff;white-space:nowrap;font-weight:600;
    text-shadow:0 0 3px #0b1026,0 0 3px #0b1026,0 1px 2px #000;pointer-events:none;}
  .map-label.city{font-size:12px;color:#e8ecff;}
  /* N1 / V3：省名常驻标注。本轮调整：缩小字号、降低视觉权重与对比度，弱化存在感 */
  .prov-name{font-size:11px;color:rgba(225,232,255,.62);font-weight:500;white-space:nowrap;
    transform:translate(-50%,-50%);pointer-events:none;letter-spacing:0;
    text-shadow:0 0 3px rgba(11,16,38,.7),0 1px 1px rgba(0,0,0,.45);}
  /* 景点点位样式统一收敛到下方 .spot-mark（定位 icon + 推荐文案 + 悬停卡片） */
  /* N1：省会常驻标注（呼吸灯圆点 + 城市名，名字按地域方位四向放置） */
  .cap-mark{position:relative;width:0;height:0;pointer-events:none;}
  /* 圆点：缩小为 5px，醒目暖金色 + 白环描边（解决淡蓝在卫星图上存在感弱的问题），并呼吸灯律动 */
  .cap-mark .cap-dot{position:absolute;left:0;top:0;width:6px;height:6px;border-radius:50%;
    background:#ffd23d;border:1.4px solid #fff8e6;transform:translate(-50%,-50%);
    animation:capPulse 2.4s ease-in-out infinite;}
  .cap-mark .cap-name{position:absolute;font-size:11px;color:#ffe9b8;font-weight:600;
    white-space:nowrap;text-shadow:0 0 3px #0b1026,0 0 3px #0b1026;}
  /* 城市名相对圆点的四向放置（由省份地域方位决定，向外侧伸展，避免相互遮挡） */
  .cap-mark.pos-top    .cap-name{left:0;bottom:8px;transform:translateX(-50%);}
  .cap-mark.pos-bottom .cap-name{left:0;top:8px;transform:translateX(-50%);}
  .cap-mark.pos-left   .cap-name{right:9px;top:0;transform:translateY(-50%);}
  .cap-mark.pos-right  .cap-name{left:9px;top:0;transform:translateY(-50%);}
  @keyframes capPulse{
    0%,100%{transform:translate(-50%,-50%) scale(.8);opacity:.85;
      box-shadow:0 0 4px #ffc21a,0 0 7px rgba(255,194,26,.5);}
    50%{transform:translate(-50%,-50%) scale(1.35);opacity:1;
      box-shadow:0 0 9px #ffd23d,0 0 18px rgba(255,210,61,.95);}
  }
  /* ============ 统一景点点位：仅缩小的定位 icon（不含文字标注） ============ */
  /* 所有景点（必去景点 / 省级景点 / 市级景点）统一使用同一套定位 icon 展示。
     按需求隐藏所有文字标注，仅保留缩小后的定位 icon；
     hover 由顶层全局气泡 #spotTip 展示推荐文案，点击则展开侧边栏详情。 */
  .spot-mark{position:relative;display:flex;align-items:center;justify-content:center;
    transform:translate(-50%,-100%);cursor:pointer;pointer-events:auto;}
  /* 定位针 icon（水滴形，适度增大以提升可见性与可点击性） */
  .spot-mark .sp-pin{width:13px;height:13px;flex:none;position:relative;
    border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    background:linear-gradient(135deg,#ff7d92,#ff4d68);
    border:1px solid #ffe1e7;box-shadow:0 0 5px rgba(255,93,115,.75),0 1px 3px rgba(0,0,0,.45);
    transition:transform .15s ease;}
  /* 定位针内部白色圆心 */
  .spot-mark .sp-pin::after{content:"";position:absolute;left:50%;top:50%;
    width:4.5px;height:4.5px;border-radius:50%;background:#fff;
    transform:translate(-50%,-50%);box-shadow:0 0 2px rgba(0,0,0,.3);}
  .spot-mark:hover .sp-pin{transform:rotate(-45deg) scale(1.35);}

  /* ============ 顶层 hover 推荐气泡（脱离地图层叠上下文，永不被遮挡） ============ */
  #spotTip{position:fixed;z-index:2147483647;pointer-events:none;
    min-width:150px;max-width:250px;
    background:rgba(14,18,42,.97);backdrop-filter:blur(8px);
    border:1px solid rgba(255,204,51,.45);border-radius:10px;padding:9px 12px;
    box-shadow:0 12px 32px rgba(0,0,0,.55);
    opacity:0;visibility:hidden;transform:translate(-50%,-100%) translateY(6px);
    transition:opacity .16s ease,transform .16s ease;}
  #spotTip.show{opacity:1;visibility:visible;transform:translate(-50%,-100%) translateY(0);}
  #spotTip::after{content:"";position:absolute;left:50%;top:100%;
    transform:translateX(-50%);border:6px solid transparent;
    border-top-color:rgba(14,18,42,.97);}
  #spotTip .tt-title{font-size:13px;font-weight:700;color:var(--accent);
    margin-bottom:3px;display:flex;align-items:center;gap:4px;}
  #spotTip .tt-city{font-size:10px;color:var(--muted);font-weight:500;}
  #spotTip .tt-desc{font-size:11px;color:#e7ecff;line-height:1.55;}
  #spotTip .tt-hint{margin-top:5px;font-size:10px;color:var(--accent);opacity:.85;}

  /* ============ 景点详情侧边栏（点击 icon 展开，含完整信息 + 图片） ============ */
  /* 统一：所有抽屉一律从右侧滑出（含景点详情侧边栏） */
  #spotPanel{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);z-index:1600;
    background:rgba(10,14,34,.97);backdrop-filter:blur(14px);
    border-left:1px solid rgba(255,255,255,.12);
    transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.5);
    max-width:100vw;}
  #spotPanel.open{transform:translateX(0);}
  #spotPanel .sphead{display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.10);}
  #spotPanel .sphead h3{margin:0;font-size:17px;letter-spacing:.5px;}
  #spotPanel .spclose{cursor:pointer;font-size:22px;color:var(--muted);background:none;
    border:none;line-height:1;padding:4px;}
  #spotPanel .spclose:hover{color:var(--text);}
  #spotPanel .spbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 0 18px;}
  /* 景点原图（横幅，加大尺寸，呈现更完整的风景画面） */
  #spotPanel .sp-photo{width:100%;height:230px;object-fit:cover;display:block;
    background:linear-gradient(135deg,#27205e,#1a1140);}
  #spotPanel .sp-photo-cap{padding:14px 18px 0;}
  #spotPanel .sp-photo-cap .pc-city{font-size:12px;color:var(--accent);letter-spacing:.5px;}
  #spotPanel .sp-photo-cap .pc-name{font-size:22px;font-weight:800;color:#fff;margin-top:2px;}
  #spotPanel .sp-photo-cap .pc-en{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:.5px;}
  #spotPanel .sp-sec{padding:14px 18px 0;}
  #spotPanel .sp-sec h4{margin:0 0 6px;font-size:13px;color:var(--accent);letter-spacing:.5px;}
  #spotPanel .sp-sec p{margin:0;font-size:13px;color:#e7ecff;line-height:1.7;}
  #spotPanel .sp-sec ul{margin:0;padding-left:2px;list-style:none;
    font-size:12px;color:#dfe6ff;line-height:1.8;}
  #spotPanel .sp-sec li{margin:2px 0;}
  /* 风景名胜：信息标签（类型/季节/时长/级别） */
  #spotPanel .sp-chips{display:flex;flex-wrap:wrap;gap:6px;}
  #spotPanel .sp-chips .chip{font-size:11px;padding:4px 10px;border-radius:14px;
    background:rgba(255,204,51,.12);color:#ffe39a;border:1px solid rgba(255,204,51,.30);}
  #spotPanel .sp-chips .chip b{color:#fff;font-weight:700;}
  /* 风景名胜：要点小卡片网格 */
  #spotPanel .sp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  #spotPanel .sp-grid .gi{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
    border-radius:10px;padding:9px 11px;}
  #spotPanel .sp-grid .gi .k{font-size:11px;color:var(--accent);letter-spacing:.5px;}
  #spotPanel .sp-grid .gi .v{font-size:12px;color:#eef2ff;margin-top:3px;line-height:1.5;}
  /* 风景名胜：缩略原图画廊（多视角微缩图） */
  #spotPanel .sp-gallery{display:grid;grid-template-columns:1fr;gap:6px;}
  #spotPanel .sp-gallery img{width:100%;height:160px;object-fit:cover;border-radius:8px;
    border:1px solid rgba(255,255,255,.10);display:block;}
  /* 终点城市高亮标注 */
  .city-target{display:flex;flex-direction:column;align-items:center;pointer-events:none;}
  .city-target .dot{width:14px;height:14px;border-radius:50%;background:#ffcc33;
    box-shadow:0 0 16px #ffcc33;animation:cityPulse 1.6s ease-out infinite;}
  .city-target .txt{margin-top:3px;font-size:14px;font-weight:800;color:#fff;
    text-shadow:0 0 4px #000,0 0 4px #000;white-space:nowrap;}
  @keyframes cityPulse{0%{box-shadow:0 0 0 0 rgba(255,204,51,.6);}
    100%{box-shadow:0 0 0 18px rgba(255,204,51,0);}}
  /* 河流/湖泊标注 */
  .water-label{font-size:9px;color:#bfe6f7;white-space:nowrap;pointer-events:none;
    text-shadow:0 0 3px #0b1026,0 0 3px #0b1026;}

  /* ============ 飞镖投掷时的屏幕震动反馈 ============ */
  @keyframes shake{
    0%,100%{transform:translate(0,0) rotate(0);}
    15%{transform:translate(-8px,5px) rotate(-1deg);}
    30%{transform:translate(7px,-6px) rotate(1deg);}
    45%{transform:translate(-6px,4px) rotate(-.6deg);}
    60%{transform:translate(5px,-3px) rotate(.6deg);}
    80%{transform:translate(-3px,2px) rotate(-.3deg);}
  }
  .shake{animation:shake .45s ease;}

  /* ============ 飞机（俯视 SVG 客机造型） ============ */
  #dart{
    position:absolute;left:0;top:0;width:40px;height:40px;z-index:1200;
    pointer-events:none;display:none;
    will-change:transform,left,top;
  }
  #dart svg{display:block;width:100%;height:100%;overflow:visible;
    filter:drop-shadow(0 6px 6px rgba(0,0,0,.35));}
  @keyframes engineGlow{0%,100%{opacity:.55;}50%{opacity:1;}}
  #dart .engine-glow{animation:engineGlow .5s ease-in-out infinite;
    transform-origin:center;transform-box:fill-box;}
  /* 尾迹云 */
  #trail{position:absolute;left:0;top:0;z-index:1190;pointer-events:none;
    width:8px;height:8px;border-radius:50%;display:none;
    background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,255,255,0));
    transform:translate(-50%,-50%);}
  @keyframes puff{from{opacity:.7;transform:translate(-50%,-50%) scale(.6);}
                  to{opacity:0;transform:translate(-50%,-50%) scale(2.4);}}
  /* 命中冲击波 */
  #impact{position:absolute;left:0;top:0;width:10px;height:10px;border-radius:50%;
    border:3px solid var(--accent);z-index:1190;display:none;pointer-events:none;
    transform:translate(-50%,-50%);}
  @keyframes ring{from{width:10px;height:10px;opacity:1;}to{width:120px;height:120px;opacity:0;}}
  .ring{animation:ring .6s ease-out;}

  /* ============ 底部功能区（横向控制栏） ============ */
  #panel{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:rgba(12,16,40,.82);backdrop-filter:blur(10px);
    border-top:1px solid rgba(255,255,255,.10);
    padding:12px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  }
  .ctrl{display:flex;flex-direction:column;gap:6px;}
  .ctrl .lab{font-size:11px;color:var(--accent);letter-spacing:.5px;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;}
  .tag{
    cursor:pointer;user-select:none;font-size:12px;padding:4px 10px;border-radius:18px;
    border:1px solid rgba(255,255,255,.18);color:var(--text);transition:.18s;
    background:rgba(255,255,255,.04);
  }
  .tag:hover{border-color:var(--accent);}
  .tag.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#231a00;border-color:transparent;font-weight:600;}

  /* 出发地选择下拉 */
  #departSel{
    font-size:13px;padding:7px 10px;border-radius:10px;cursor:pointer;
    background:rgba(255,255,255,.06);color:var(--text);
    border:1px solid rgba(255,255,255,.18);min-width:120px;
  }
  #departSel option{background:#1a1140;color:var(--text);}

  #throwBtn{
    margin-left:auto;font-size:16px;font-weight:700;letter-spacing:1px;cursor:pointer;
    border:none;border-radius:12px;padding:12px 26px;color:#241a00;white-space:nowrap;
    background:linear-gradient(135deg,var(--accent),#ff9a3d);
    box-shadow:0 8px 22px rgba(255,150,40,.35);transition:.15s;
  }
  #throwBtn:hover{transform:translateY(-2px);}
  #throwBtn:disabled{filter:grayscale(.6) brightness(.7);cursor:not-allowed;transform:none;}

  /* 飞行状态条 */
  #status{font-size:12px;color:var(--muted);min-height:16px;}
  .step-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 3px;
    background:rgba(255,255,255,.25);vertical-align:middle;}
  .step-dot.active{background:var(--accent);box-shadow:0 0 8px var(--accent);}

  /* ============ 结果卡片：浮于地图底部居中 ============ */
  #result{
    display:none;position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:22;
    background:rgba(12,16,40,.92);backdrop-filter:blur(10px);
    border:1px solid rgba(255,204,51,.35);border-radius:16px;
    padding:14px 22px;min-width:280px;max-width:90vw;text-align:center;
    box-shadow:0 12px 40px rgba(0,0,0,.45);animation:pop .4s ease;
  }
  @keyframes pop{from{transform:translateX(-50%) scale(.85);opacity:0;}to{transform:translateX(-50%) scale(1);opacity:1;}}
  /* 结果卡关闭按钮：右上角圆形 × */
  #rClose{position:absolute;top:8px;right:10px;width:24px;height:24px;line-height:22px;
    text-align:center;border-radius:50%;cursor:pointer;font-size:15px;font-weight:700;
    color:var(--text);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
    transition:background .2s,color .2s;z-index:2;}
  #rClose:hover{background:rgba(255,93,115,.85);color:#fff;border-color:transparent;}
  #result .prov{font-size:12px;color:var(--muted);}
  #result .city{font-size:26px;font-weight:800;margin:4px 0;
    background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;}
  #result .desc{font-size:12px;color:var(--text);line-height:1.6;}
  #result .citytags{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
  #result .citytags span{font-size:11px;padding:3px 8px;border-radius:10px;background:rgba(255,204,51,.15);color:var(--accent);}
  /* V4：结果页「推荐景点 + 旅行攻略」展开区 */
  #result .rmore-toggle{margin-top:10px;cursor:pointer;font-size:12px;font-weight:600;
    color:var(--accent);user-select:none;display:inline-flex;align-items:center;gap:4px;}
  #result .rmore-toggle .arr{transition:transform .25s;}
  #result.collapsed .rmore-toggle .arr{transform:rotate(-90deg);}
  #result .rmore{max-height:46vh;overflow-y:auto;text-align:left;margin-top:10px;
    border-top:1px dashed rgba(255,204,51,.25);padding-top:10px;transition:.25s;}
  #result.collapsed .rmore{display:none;}
  #result .rmore h4{margin:10px 0 6px;font-size:13px;color:var(--accent);letter-spacing:.5px;}
  #result .rmore h4:first-child{margin-top:0;}
  #result .spotlist{display:flex;flex-direction:column;gap:6px;}
  #result .spotlist .sp{display:flex;gap:8px;align-items:baseline;
    background:rgba(255,255,255,.04);border-radius:8px;padding:6px 9px;}
  #result .spotlist .sp .si{color:#ffd54a;font-size:12px;flex:none;}
  #result .spotlist .sp .sn{font-size:13px;color:#fff;font-weight:600;}
  #result .spotlist .sp .sc{font-size:11px;color:var(--muted);margin-left:auto;flex:none;}
  #result .guide{font-size:12px;color:#dfe6ff;line-height:1.7;}
  #result .guide li{margin:2px 0;}
  #result .guide li.g-h{margin-top:8px;color:var(--accent);font-size:12.5px;
    border-top:1px dashed rgba(255,204,51,.2);padding-top:6px;list-style:none;margin-left:-18px;}
  /* G3：推荐旅行路线（带箭头的有序景点序列） */
  #result .route{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;font-size:12px;}
  #result .route .rt{background:rgba(255,204,51,.14);border:1px solid rgba(255,204,51,.3);
    color:#ffe49a;border-radius:7px;padding:4px 9px;font-weight:600;}
  #result .route .arr2{color:var(--accent);font-weight:700;opacity:.8;}
  /* G3：对应景点真实照片网格 */
  #result .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
  #result .photos figure{margin:0;border-radius:9px;overflow:hidden;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);}
  #result .photos img{width:100%;height:78px;object-fit:cover;display:block;background:#0c1330;}

<div id="stage">

<script>
/* =========================================================================

// 省级行政区 → 所属地理大区（国家标准七大地理分区）

  "重庆市":"西南","四川省":"西南","贵州省":"西南","云南省":"西南","西藏自治区":"西南",

// 主要河流（近似走向，仅作地貌示意；坐标为经纬度折线）
const RIVERS = [
  {name:'长江', coords:[[91.0,33.5],[97.0,31.0],[100.0,28.5],[101.7,26.6],[104.0,28.8],

  {name:'珠江', coords:[[103.0,25.0],[106.0,24.0],[108.3,22.8],[111.0,23.3],[113.2,23.1],[113.6,22.4]]}
];
// 主要湖泊（地貌示意点）
const LAKES = [
  {name:'青海湖', value:[100.2,36.9]}, {name:'鄱阳湖', value:[116.3,29.1]},
  {name:'洞庭湖', value:[112.8,29.3]}, {name:'太湖', value:[120.2,31.2]},

];
// 构建全国视图各省的地貌底色（命中省份高亮覆盖）
function buildTerrainRegions(){
  return Object.keys(ELEV_TIER).map(p=>({
    name:p,
    itemStyle:{areaColor:TIER_COLOR[ELEV_TIER[p]], borderColor:TERRAIN_COLORS.border, borderWidth:.7}

}

/* =========================================================================

// 取景点真实照片 URL：先按全名精确匹配，再按包含关系模糊匹配，未命中返回通用中国风景实拍图（绝不返回 null/图标）
function spotRealPhoto(name){
  if(!name) return FALLBACK_PHOTO;
  if(SPOT_PHOTO[name]) return SPOT_PHOTO[name];
  for(const k in SPOT_PHOTO){ if(name.indexOf(k)>=0 || k.indexOf(name)>=0) return SPOT_PHOTO[k]; }
  return FALLBACK_PHOTO;
}

function getSpotDesc(name, city){

  return (city? city+'的':'')+'特色景点，值得安排行程前往打卡体验。';

// 省份层级：返回该省所有可展示旅游点位的标记（含所属城市，供 hover 卡片展示）
function provinceAttractionMarks(province){
  const list = ATTRACTIONS[province]||[];
  return list.map(a=>({name:a.name, city:a.city, value:[a.lng,a.lat]}));
}
// 市级层级：返回某地级市范围内的旅游点位，并生成首尾相接的串联连线坐标
function cityAttractions(province, cityName){
  const list = (ATTRACTIONS[province]||[]).filter(a=>a.city===cityName);
  const marks = list.map(a=>({name:a.name, city:a.city, value:[a.lng,a.lat]}));
  const coords = list.map(a=>[a.lng,a.lat]);   // 按数据顺序串联
  return {marks, coords};
}

/* =========================================================================
 *  地图层：加载官方省界 GeoJSON；放大时动态加载该省地级市边界 GeoJSON
 *  —— 全部为官方行政区划数据，仅陆地，标注只含省/省会/地级市等行政名称
 * ========================================================================= */
let map, GEO_LOADED=false, regionCenter={};
let provinceAdcode={};            // 省名 → 行政区划代码（用于拉取下级市界）
const cityGeoCache={};            // 已加载的省级下钻地图缓存（含 GeoJSON）

// 全国默认视图：中心约在中国几何中心，缩放级别 4（卫星图全国概览）
const CHINA_CENTER = [35.5, 103.5];   // [lat,lng]
const CHINA_ZOOM   = 4;
// 中国地理范围（用于限制视野，默认只加载中国地图、不加载世界地图）
const CHINA_BOUNDS = L.latLngBounds([3.5, 73.0], [53.8, 135.5]);
let NATION_GEO = null;                 // 全国省界 GeoJSON（用于命中省份高亮）

// 取某省的 GeoJSON Feature（用于高亮描边）
function provinceFeature(name){
  if(!NATION_GEO) return null;
  const f = NATION_GEO.features.find(x=>x.properties.name===name);
  return f ? {type:'FeatureCollection', features:[f]} : null;
}

/* ---------- Leaflet 地图初始化：卫星图层 + 自定义图层窗格 ---------- */
// S1：地图基底采用卫星图层。默认仅聚焦中国地图：通过 maxBounds 限定视野范围，
//      地图不会平移/加载到世界其它区域（即「默认不加载世界地图」）。
map = L.map('map', {
  center: CHINA_CENTER,
  zoom: CHINA_ZOOM,
  minZoom: 4,                     // 最小级别仅到全国概览，防止缩出到世界地图
  zoomControl: true,
  zoomSnap: 0.25,                 // 允许 1/4 级缩放，过渡更细腻
  worldCopyJump: false,
  maxBounds: CHINA_BOUNDS,        // 视野锁定中国范围，不加载境外瓦片
  maxBoundsViscosity: 1.0,        // 完全阻止拖出中国边界
  attributionControl: false
});
// 卫星影像底图（缩放时河流/边界等矢量层会与之天然联动）。
// 调整：移除 bounds 限制，使卫星瓦片在整个可视区域内完整渲染、铺满显示区，
// 不再因 China bounds 在边缘/海域留下未加载的深色空白（视野平移仍由 maxBounds 锁定中国）。
// N4：keepBuffer:4 扩大视口外瓦片缓冲，updateWhenZooming:false 缩放过程中不逐帧刷新瓦片
const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {maxZoom: 18, minZoom: 4, keepBuffer: 4,
   updateWhenZooming: false, updateWhenIdle: true}).addTo(map);
// 说明：原天地图中文矢量注记图层（cva_w）在脱离授权域名单独打开时会返回 403，
// 且其瓦片注记并非必需 —— 本应用所有省/市/景点标注均由自身以中文 divIcon 渲染，
// 地图主体语言始终为中文。故移除该外部注记图层，避免 403 报错与无谓请求。

// N1：主要河域高亮（非重绘水系，沿真实河道发光描边）
map.createPane('waterPane');   map.getPane('waterPane').style.zIndex = 350;
map.createPane('natPane');     map.getPane('natPane').style.zIndex = 355;  // V3：国界（高亮）
map.createPane('provPane');    map.getPane('provPane').style.zIndex = 360;  // 省界
map.createPane('cityPane');    map.getPane('cityPane').style.zIndex = 370;  // 市界
map.createPane('mustPane');    map.getPane('mustPane').style.zIndex = 380;  // V3：必去景点常驻点位

// N3：地图初始化后立即禁用全部交互，直到瓦片+数据就绪
disableInteraction();

// 各类动态矢量/标注图层组（renderMap 中重建）
const waterLayer     = L.layerGroup().addTo(map);   // 主要河域高亮（仅全国视图）
const natBorderLayer = L.layerGroup().addTo(map);   // V3：中国国界（高亮提亮，静态）
const provBorderLayer= L.layerGroup().addTo(map);   // 全国省界（静态，仅建一次）
const cityBorderLayer= L.layerGroup().addTo(map);   // 命中省的地级市界（放大后清晰）
const baseLabelLayer = L.layerGroup().addTo(map);   // N1：省名/省会常驻标注（缩放不消失）
const mustLayer      = L.layerGroup().addTo(map);   // V3：国内必去景点常驻点位（仅全国视图）
const labelLayer     = L.layerGroup().addTo(map);   // 动态行政标注（地级市名）
const highlightLayer = L.layerGroup().addTo(map);   // 命中省份高亮描边
const attractionLayer= L.layerGroup().addTo(map);   // 旅游点位 + 市级连线
const targetLayer    = L.layerGroup().addTo(map);   // 终点城市

// 从 DataV 官方 CDN 获取中国省级行政区 GeoJSON（叠加于卫星图上）
fetch('https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json')
  .then(r=>r.json())
  .then(geo=>{
    NATION_GEO = geo;
    geo.features.forEach(f=>{
      const p=f.properties;
      const c = p.centroid || p.center;
      if(c) regionCenter[p.name] = c;          // [lng,lat]
      if(p.adcode) provinceAdcode[p.name] = p.adcode;
    });
    // 省界矢量（地理锚定，缩放联动）—— N5：静态层，仅在此构建一次，缩放时不重建
    // V3：省界提亮（颜色更亮、不透明度提高），更清晰可辨
    L.geoJSON(geo, {
      pane:'provPane',
      style:{color:'#cfe0ff', weight:1.1, opacity:.85, fill:false}
    }).addTo(provBorderLayer);
    // V3：提高中国疆域边线亮度——单独加载国界轮廓并以高亮描边叠加在最上层
    buildNationBorder();
    // N1：主要河域高亮（非重绘水系，沿真实河道发光描边）
    buildWaterLayer();
    // N1：构建省名/省会常驻标注（缩放后不消失）
    buildBaseLabels();
    // V3：构建国内必去景点常驻点位（全国视图标注）
    buildMustVisit();
    GEO_LOADED = true;
    renderMap();
    // N4：底图瓦片就绪后再解禁；并预热下一级常用缩放瓦片
    satLayer.once('load', ()=>{
      hideLoading();                          // 数据+瓦片就绪，隐藏 Loading 遮罩
      enableInteraction();                    // N3：解禁全部交互
      setStatus('准备就绪，点击下方按钮开始随机选取');
    });
    // 兜底：8s 内未触发 load 也强制解禁，避免弱网卡死
    setTimeout(()=>{ if(document.getElementById('loading') && !document.getElementById('loading').classList.contains('hide')){
      hideLoading(); enableInteraction(); setStatus('准备就绪（部分卫星瓦片仍在加载）'); } }, 8000);
  })
  .catch(()=>{
    setStatus('⚠️ 地图加载失败，请检查网络后刷新页面');
    const lt=document.querySelector('#loading .ltext');
    const ls=document.querySelector('#loading .lsub');
    if(lt) lt.textContent='地图加载失败';
    if(ls) ls.textContent='请检查网络后刷新页面';
  });

// 隐藏 Loading 遮罩
function hideLoading(){
  const el=document.getElementById('loading');
  if(el){ el.classList.add('hide'); setTimeout(()=>{ el.style.display='none'; },500); }
}

/* N3：加载完成前禁用全部交互；就绪后解禁 */
function disableInteraction(){
  ['dragging','scrollWheelZoom','touchZoom','doubleClickZoom','boxZoom','keyboard']
    .forEach(h=>{ if(map[h]) map[h].disable(); });
  if(map.tap) map.tap.disable();
  // 控件禁用
  const btn=document.getElementById('throwBtn'); if(btn) btn.disabled=true;
  const sel=document.getElementById('departSel'); if(sel) sel.disabled=true;
  document.querySelectorAll('#tagBox .tag').forEach(t=>t.style.pointerEvents='none');
}
function enableInteraction(){
  ['dragging','scrollWheelZoom','touchZoom','doubleClickZoom','boxZoom','keyboard']
    .forEach(h=>{ if(map[h]) map[h].enable(); });
  if(map.tap) map.tap.enable();
  const btn=document.getElementById('throwBtn'); if(btn) btn.disabled=false;
  const sel=document.getElementById('departSel'); if(sel) sel.disabled=false;
  document.querySelectorAll('#tagBox .tag').forEach(t=>t.style.pointerEvents='');
}

// V2：弱化河域视觉存在感——卫星图本身已清晰呈现水系，此处仅以极淡的细线
// 作为「主要河域」示意，不再绘制加粗发光的双层水道，避免喧宾夺主；
// 湖泊弱化为极小的淡色点，且不再叠加文字标注。
function buildWaterLayer(){
  waterLayer.clearLayers();
  RIVERS.forEach(r=>{
    const latlngs = r.coords.map(c=>[c[1], c[0]]);   // [lng,lat]→[lat,lng]
    // 单层极淡细线：仅示意主要河域走向，弱化存在感
    L.polyline(latlngs, {pane:'waterPane', color:'#bfe6f7',
      weight:1, opacity:.28, lineJoin:'round', lineCap:'round'}).addTo(waterLayer);
  });
  LAKES.forEach(k=>{
    const ll=[k.value[1], k.value[0]];
    // 湖泊弱化为极小淡点，不再加文字标注
    L.circleMarker(ll, {pane:'waterPane', radius:2.5, color:'#bfe6f7', weight:0.5,
      opacity:.35, fillColor:'#9fd0e8', fillOpacity:.30}).addTo(waterLayer);
  });
}

// N1：构建「省名 + 省会」常驻标注（地理锚定，缩放放大后不消失）
let baseLabelsBuilt=false;
// 省级行政区简称（用于地图标注，更简洁）
function shortProvName(name){
  return name
    .replace(/维吾尔自治区$/,'').replace(/壮族自治区$/,'').replace(/回族自治区$/,'')
    .replace(/特别行政区$/,'').replace(/自治区$/,'')
    .replace(/省$/,'').replace(/市$/,'');
}
function buildBaseLabels(){
  baseLabelLayer.clearLayers();
  // 省名：取各省中心点
  Object.keys(regionCenter).forEach(name=>{
    const c=regionCenter[name];   // [lng,lat]
    L.marker([c[1], c[0]], {interactive:false, icon:L.divIcon({className:'',
      iconSize:[0,0], iconAnchor:[0,0],
      html:`<div class="prov-name">${shortProvName(name)}</div>`})
    }).addTo(baseLabelLayer);
  });
  // 省会/首府：呼吸灯圆点 + 城市名（名字按地域方位放在圆点的上/下/左/右，向外侧伸展）
  Object.keys(CAPITALS).forEach(p=>{
    const cap=CAPITALS[p];
    // 以全国地理中心为基准，按省会相对方位决定城市名放置方向（向外侧伸展，减少相互遮挡）
    const dLng = cap.lng - CHINA_CENTER[1];
    const dLat = cap.lat - CHINA_CENTER[0];
    let pos;
    // 横向跨度按经度展开较广，乘以权重让东/西判断更灵敏；其余归为上/下
    if(Math.abs(dLng)*1.15 >= Math.abs(dLat)){
      pos = dLng>=0 ? 'pos-right' : 'pos-left';
    }else{
      pos = dLat>=0 ? 'pos-top' : 'pos-bottom';
    }
    L.marker([cap.lat, cap.lng], {interactive:false, icon:L.divIcon({className:'',
      iconSize:[0,0], iconAnchor:[0,0],
      html:`<div class="cap-mark ${pos}"><span class="cap-dot"></span><span class="cap-name">${cap.city}</span></div>`})
    }).addTo(baseLabelLayer);
  });
  baseLabelsBuilt=true;
}

// V3：提高中国疆域边线亮度——合并全部省界外轮廓不便，改为用国界专用 GeoJSON
//      高亮描边（双层：外层柔光 + 内层亮金线），静态仅构建一次。
function buildNationBorder(){
  natBorderLayer.clearLayers();
  fetch('https://geo.datav.aliyun.com/areas_v3/bound/100000.json')
    .then(r=>r.json())
    .then(line=>{
      // 外层柔光：加粗半透明，提升边线存在感
      L.geoJSON(line, {pane:'natPane',
        style:{color:'#7fd0ff', weight:5, opacity:.35, fill:false,
               lineJoin:'round', lineCap:'round'}}).addTo(natBorderLayer);
      // 内层亮线：醒目高亮，清晰勾勒国界
      L.geoJSON(line, {pane:'natPane',
        style:{color:'#eaf6ff', weight:1.8, opacity:.95, fill:false,
               lineJoin:'round', lineCap:'round'}}).addTo(natBorderLayer);
    })
    .catch(()=>{/* 国界轮廓加载失败不影响主流程 */});
}

// 统一景点点位图标工厂：仅缩小后的定位针 icon（无任何文字标注）。
// 所有层级（必去景点 / 省级 / 市级）的景点都使用本工厂，外观完全一致。
function spotIcon(){
  return L.divIcon({className:'', iconSize:[0,0], iconAnchor:[0,0],
    html:`<div class="spot-mark"><div class="sp-pin"></div></div>`});
}

/* 顶层 hover 气泡：跟随鼠标在景点 icon 上方弹出推荐文案。
   #spotTip 为 body 下的 fixed 元素，z-index 取最大值，永不被地图窗格/侧边栏遮挡。 */
const spotTip = document.getElementById('spotTip');
const mapWrap = document.getElementById('mapWrap');
function showSpotTip(name, city, x, y){
  document.getElementById('ttName').textContent = name;
  const cityEl=document.getElementById('ttCity');
  cityEl.textContent = city||''; cityEl.style.display = city?'block':'none';
  document.getElementById('ttDesc').textContent = getSpotDesc(name, city);
  spotTip.style.left = x+'px';
  spotTip.style.top  = (y-14)+'px';   // 略高于 icon 顶端
  spotTip.classList.add('show');
}
function hideSpotTip(){ spotTip.classList.remove('show'); }

// 省会点位查找：若给定经纬度与某省会圆点足够接近（像素级重叠），返回该省会的精确经纬度，
// 用于把景点定位 icon「吸附」到省会小圆点上，避免两点错位重叠造成视觉杂乱。
const CAP_LL = Object.keys(CAPITALS).map(p=>CAPITALS[p]);  // [{city,lng,lat},...]
function snapToCapital(lat, lng){
  if(!map) return null;
  const p = map.latLngToContainerPoint([lat, lng]);
  let best=null, bestD=Infinity;
  for(const c of CAP_LL){
    const cp = map.latLngToContainerPoint([c.lat, c.lng]);
    const d = Math.hypot(cp.x-p.x, cp.y-p.y);
    if(d<bestD){ bestD=d; best=c; }
  }
  // 阈值 14px：两点在屏幕上基本重叠时才吸附
  return (best && bestD<=14) ? best : null;
}

// 创建一个统一的景点标记：定位 icon + hover 顶层气泡 + 点击展开侧边栏详情。
function makeSpotMarker(lat, lng, name, city, pane){
  // 与省会点位重叠时，将景点定位锚定到省会小圆点的精确位置（两点对齐，避免错位重叠）
  const snap = snapToCapital(lat, lng);
  if(snap){ lat = snap.lat; lng = snap.lng; }
  const opts = {icon:spotIcon()};
  if(pane) opts.pane = pane;
  const mk = L.marker([lat, lng], opts);
  mk.spotName = name; mk.spotCity = city||'';
  mk.on('mouseover', ()=>{
    const p = map.latLngToContainerPoint([lat, lng]);
    const rect = mapWrap.getBoundingClientRect();
    showSpotTip(name, city, rect.left + p.x, rect.top + p.y);
  });
  mk.on('mouseout', hideSpotTip);
  mk.on('click', ()=>{ hideSpotTip(); openSpotPanel(name, city); });
  return mk;
}

 *  无需任何外部图片依赖，保证离线/弱网下也必定有「对应图片」展示。
 * ========================================================================= */
const spotPanel = document.getElementById('spotPanel');
// 景点 → 代表性 emoji 图标（用于图片横幅，未收录回退到通用山水图标）
const SPOT_EMOJI = {
  "故宫":"🏯","八达岭长城":"🧱","兵马俑":"🗿","西湖":"🌊","黄山":"⛰️","张家界":"🏔️",
  "九寨沟":"💧","布达拉宫":"🏛️","漓江":"🚣","丽江古城":"🏘️","泰山":"🌄","鼓浪屿":"🏝️",
  "莫高窟":"🕍","天涯海角":"🏖️","黄果树瀑布":"🌊","乐山大佛":"🗿","峨眉山":"⛰️",
  "少林寺":"🥋","龙门石窟":"🗿","武当山":"⛩️","华山":"🏔️","黄鹤楼":"🏯",
  "凤凰古城":"🏘️","乌镇":"🛶","周庄古镇":"🛶","土楼":"🏯","武夷山":"🍵"
};
function spotEmoji(name){
  if(SPOT_EMOJI[name]) return SPOT_EMOJI[name];
  if(/寺|庙|宫|塔|楼|阁/.test(name)) return "🏯";
  if(/山|峰|岭/.test(name)) return "⛰️";
  if(/湖|江|河|泉|瀑|海|湾|岛/.test(name)) return "🌊";
  if(/古城|古镇|寨|村|街/.test(name)) return "🏘️";
  if(/窟|石刻|俑/.test(name)) return "🗿";
  return "🏞️";
}
// 风景名胜元信息：依据景点名特征推断「类型 / 适宜季节 / 建议时长 / 资源级别 / 看点」，
// 全部为本地规则推断，无外部依赖，保证离线也必有「风景名胜」结构化内容。
function spotScenic(name){
  let type='综合景区';
  if(/寺|庙|宫|塔|楼|阁|陵|庵|观/.test(name)) type='人文古迹';
  else if(/山|峰|岭|岩|崖/.test(name)) type='名山胜境';
  else if(/湖|江|河|泉|瀑|海|湾|岛|溪|潭/.test(name)) type='山水湖海';
  else if(/古城|古镇|寨|村|街|坊/.test(name)) type='古城古镇';
  else if(/窟|石刻|俑|碑/.test(name)) type='石窟石刻';
  let season='四季皆宜，春秋出游体验更佳', hours='半天';
  if(type==='名山胜境'){ season='春花夏凉秋叶冬雪，9-11 月云海最佳'; hours='1 天（含登山缆车）'; }
  else if(type==='山水湖海'){ season='丰水期（4-10 月）水势壮观，景色更灵动'; hours='半天至 1 天'; }
  else if(type==='古城古镇'){ season='清晨与夜晚人少景美，避开节假日高峰'; hours='半天至 1 天（含夜景）'; }
  else if(type==='人文古迹'||type==='石窟石刻'){ season='春秋两季气候宜人，宜请讲解深度游览'; }
  const famous = SPOT_EMOJI.hasOwnProperty(name) || /长城|故宫|兵马俑|布达拉宫|莫高窟|黄山|泰山|九寨沟/.test(name);
  const level = famous ? '5A 级 / 世界级名胜' : '知名景区 / 地方名胜';
  const highlights = {
    '人文古迹':['古建格局与历史脉络','匾额楹联与雕饰细节','登高远眺的城景视野'],
    '名山胜境':['日出云海与奇峰怪石','栈道索道的临崖体验','四季更替的山林景致'],
    '山水湖海':['碧水倒影与沿岸风光','泛舟/竹筏的水上视角','日落与水雾的光影'],
    '古城古镇':['青石巷弄与水乡格局','夜景灯火与市井烟火','地方民俗与特色小吃'],
    '石窟石刻':['造像规模与雕刻工艺','宗教艺术的历史价值','石壁题记与岁月痕迹'],
    '综合景区':['标志性景观打卡','自然与人文的融合','适合全家慢游休闲']
  }[type];
  return {type, season, hours, level, highlights};
}

// 按需加载某省的「地级市」边界（官方数据），返回其地级市中心点列表 + GeoJSON
async function loadProvinceCities(province){
  if(cityGeoCache[province]) return cityGeoCache[province];
  const adcode = provinceAdcode[province];
  if(!adcode) return {cities:[], geo:null};
  const url=`https://geo.datav.aliyun.com/areas_v3/bound/${adcode}_full.json`;
  const geo = await fetch(url).then(r=>r.json());
  const cities = geo.features
    .filter(f=>f.properties.name)
    .map(f=>{
      const c=f.properties.centroid||f.properties.center;
      return c ? {name:f.properties.name, lng:c[0], lat:c[1]} : null;
    })
    .filter(Boolean);
  cityGeoCache[province] = {cities, geo};
  return cityGeoCache[province];
}

let highlightProvince = null;   // 当前高亮的命中省份
let highlightGeo = null;        // 命中省份的 GeoJSON（用于描边高亮）
let cityMarks = [];             // 城市标记点（终点城市）[{name,value:[lng,lat]}]
let cityBorderGeo = null;       // 命中省的地级市边界 GeoJSON（S3：放大后清晰）
let viewMode = 'china';         // 'china' 全国视图 | 'province' 省内下钻视图
let labelMarks = [];            // 当前层级的行政标注点（省会/地级市）

// 文本标注 divIcon 工厂
function textIcon(text, cls){
  return L.divIcon({className:'', iconSize:[0,0], iconAnchor:[0,0],
    html:`<div class="map-label ${cls||''}" style="transform:translate(8px,-7px)">${text}</div>`});
}

// 行政标注渲染：全国视图原样显示；省内视图按“优先级 + 像素碰撞检测”动态稀释，
// 放大空间不足时仅显示少数核心城市（省会优先），放大到能放下时再逐步显现更多。
function renderCityLabels(){
  labelLayer.clearLayers();
  if(!map) return;
  if(viewMode==='china'){
    // 全国视图：省会/主要城市标注，数量有限不做碰撞处理
    labelMarks.forEach(m=>{
      L.marker([m.value[1], m.value[0]], {interactive:false,
        icon:textIcon(m.name, '')}).addTo(labelLayer);
    });
    return;
  }
  // 省内视图：按优先级排序后做贪心碰撞放置
  const cap = highlightProvince && CAPITALS[highlightProvince] ? CAPITALS[highlightProvince].city : '';
  const sorted = labelMarks.map((m,i)=>{
    // 省会优先级最高，其余按原始顺序（多为面积/中心权重）次之
    let pr = 1;
    if(cap && (m.name===cap || m.name.indexOf(cap)>=0 || cap.indexOf(m.name)>=0)) pr = 0;
    return {m, pr, i};
  }).sort((a,b)=> a.pr-b.pr || a.i-b.i);

  const placed = [];                       // 已放置标签的像素包围盒
  const PAD_X = 4, PAD_Y = 3;              // 包围盒外扩，避免贴边
  sorted.forEach(({m})=>{
    const p = map.latLngToContainerPoint([m.value[1], m.value[0]]);
    // 估算文本像素尺寸：城市名 12px 字号，单字约 12px 宽
    const w = m.name.length * 12 + 8, h = 16;
    // 标签锚点：icon 右侧偏移 translate(8,-7)
    const box = {x1:p.x+8-PAD_X, y1:p.y-7-PAD_Y, x2:p.x+8+w+PAD_X, y2:p.y-7+h+PAD_Y};
    const hit = placed.some(b=> !(box.x2<b.x1 || box.x1>b.x2 || box.y2<b.y1 || box.y1>b.y2));
    if(hit) return;                        // 与已放置标签重叠 → 本级不显示，留待放大后再现
    placed.push(box);
    L.marker([m.value[1], m.value[0]], {interactive:false,
      icon:textIcon(m.name, 'city')}).addTo(labelLayer);
  });
}

// 渲染地图：根据当前全局状态重建各动态矢量/标注图层（Leaflet 原生缩放联动）
function renderMap(){
  if(!map) return;
  // 1) 河流/湖泊 + 必去景点：仅全国视图显示（下钻后避免遮挡卫星细节与城市标注）
  if(viewMode==='china'){
    if(!map.hasLayer(waterLayer)) waterLayer.addTo(map);
    if(!map.hasLayer(mustLayer))  mustLayer.addTo(map);
  }else{
    map.removeLayer(waterLayer);
    map.removeLayer(mustLayer);
  }

  // 2) S3：命中省的地级市界（放大后清晰可辨识）
  cityBorderLayer.clearLayers();
  if(cityBorderGeo){
    L.geoJSON(cityBorderGeo, {pane:'cityPane',
      style:{color:'#ffe7b0', weight:1.4, opacity:.95, fill:false}}).addTo(cityBorderLayer);
  }

  // 3) 命中省份高亮描边
  highlightLayer.clearLayers();
  if(highlightProvince && highlightGeo){
    L.geoJSON(highlightGeo, {pane:'provPane',
      style:{color:'#ff8a3d', weight:2.4, opacity:1,
             fill:true, fillColor:'#ff8a3d', fillOpacity:.12}}).addTo(highlightLayer);
  }

  // 4) 行政标注（省会/主要城市 或 地级市名）——省内视图按优先级+像素碰撞动态稀释
  renderCityLabels();

  // 5) 旅游点位（统一缩小定位 icon + hover 顶层气泡 + 点击侧边栏）+ 市级连线
  attractionLayer.clearLayers();
  if(attractionLinks.length>1){
    L.polyline(attractionLinks.map(c=>[c[1],c[0]]), {color:'#ff7a90', weight:2,
      opacity:.9, dashArray:'6 5'}).addTo(attractionLayer);
  }
  attractionMarks.forEach(a=>{
    makeSpotMarker(a.value[1], a.value[0], a.name, a.city||'').addTo(attractionLayer);
  });

  // 6) 终点城市高亮
  targetLayer.clearLayers();
  cityMarks.forEach(c=>{
    L.marker([c.value[1], c.value[0]], {interactive:false, icon:L.divIcon({
      className:'', iconSize:[0,0], iconAnchor:[0,0],
      html:`<div class="city-target" style="transform:translate(-7px,-7px)"><div class="dot"></div><div class="txt">${c.name}</div></div>`})
    }).addTo(targetLayer);
  });
}

// 地图缩放/平移动画：Leaflet 原生 flyTo（卫星瓦片与所有矢量层同步缩放）
// targetZoom 为 Leaflet 缩放级别；targetCenter 为 [lng,lat]；dur 毫秒
function animateZoom(targetZoom, targetCenter, dur=1000){
  return new Promise(resolve=>{
    const ll=[targetCenter[1], targetCenter[0]];
    map.flyTo(ll, targetZoom, {duration: dur/1000, easeLinearity:.25});
    map.once('moveend', ()=>resolve());
  });
}
window.addEventListener('resize',()=>map.invalidateSize());

// 地图平移/缩放时关闭可能残留的 hover 气泡，避免气泡停留在错误位置
map.on('movestart zoomstart', hideSpotTip);

// 缩放/平移结束后重排地级市标注：放大空间变大时显现更多城市，缩小时再次稀释
map.on('zoomend moveend', ()=>{ if(viewMode==='province') renderCityLabels(); });

/* =========================================================================
 *  飞机飞行动画系统（简化版）：滑行 → 盘旋 → 飞行 → 降落
 *  —— 机头始终对齐运动方向；全程地理锚定，地图拖拽/缩放时飞机贴合航迹。
 * ========================================================================= */
const dart = document.getElementById('dart');
const dartSvg = dart.querySelector('svg');
const impact = document.getElementById('impact');
const trail = document.getElementById('trail');

// 飞机状态
const plane = {x:0, y:0, lng:0, lat:0, heading:0, alt:0,
               liftPx:0, bank:0, scale:0.5, visible:false, geoLocked:false};
const CRUISE_LIFT = 90;

function setAltShadow(h){
  const dy=4+12*h, blur=4+10*h, op=0.4-0.15*h;
  dartSvg.style.filter=`drop-shadow(0 ${dy.toFixed(1)}px ${blur.toFixed(1)}px rgba(0,0,0,${op.toFixed(2)}))`;
}
function placePlane(x,y,heading,bank,scaleBase){
  const sc=(scaleBase!=null?scaleBase:0.5)*(0.85+0.3*plane.alt);
  plane.x=x; plane.y=y; plane.heading=heading;
  const rx=Math.round(x), ry=Math.round(y);
  dart.style.left=rx+'px'; dart.style.top=ry+'px';
  dart.style.transform=`translate3d(-50%,-50%,0) rotateZ(${heading.toFixed(2)}deg) rotateY(${(bank||0).toFixed(2)}deg) scale(${sc.toFixed(3)})`;
  setAltShadow(plane.alt);
}
function drawPlane(){
  const base=geoToPixel(plane.lng,plane.lat);
  placePlane(base.x,base.y-plane.liftPx,plane.heading,plane.bank,plane.scale);
}
function lerpAngle(a,b,t){
  let d=b-a; while(d>180)d-=360; while(d<-180)d+=360;
  return a+d*t;
}
function geoToPixel(lng,lat){
  const p=map.latLngToContainerPoint([lat,lng]);
  return {x:p.x, y:p.y};
}
function clampPixelToChina(px,py){
  const ll=map.containerPointToLatLng([px,py]);
  const sw=CHINA_BOUNDS.getSouthWest(), ne=CHINA_BOUNDS.getNorthEast();
  const pad=0.4;
  const lat=Math.max(sw.lat+pad,Math.min(ne.lat-pad,ll.lat));
  const lng=Math.max(sw.lng+pad,Math.min(ne.lng-pad,ll.lng));
  return geoToPixel(lng,lat);
}
// 地图移动时重绘飞机
map.on('move zoom zoomanim',()=>{ if(plane.visible&&plane.geoLocked) drawPlane(); });

let trailTimer=null;
function spawnTrail(x,y){
  const t=trail.cloneNode(); t.id=''; t.style.cssText=trail.style.cssText;
  t.style.left=x+'px'; t.style.top=y+'px'; t.style.display='block';
  t.style.animation='puff .8s ease-out forwards';
  mapWrap.appendChild(t);
  setTimeout(()=>t.remove(),800);
}

// 飞行：从当前地理坐标沿贝塞尔弧线飞向目标
function flyPlane(tLng,tLat,opts={}){
  return new Promise(resolve=>{
    const sLng=plane.lng, sLat=plane.lat;
    const dur=opts.dur||2000, t0=performance.now();
    const arc=opts.arc!=null?opts.arc:60;
    const route=opts.route;
    plane.geoLocked=true; plane.visible=true;
    dart.style.display='block';
    const sp0=geoToPixel(sLng,sLat), tp0=geoToPixel(tLng,tLat);
    let cpx,cpy;
    if(route==='ns'){ cpx=sp0.x; cpy=tp0.y-arc*0.4; }
    else{ cpx=(sp0.x+tp0.x)/2; cpy=(sp0.y+tp0.y)/2-arc; }
    const cpC=clampPixelToChina(cpx,cpy);
    const ctrlLL=map.containerPointToLatLng([cpC.x,cpC.y]);
    let prevX=plane.x, prevY=plane.y, puffAcc=0, lastH=plane.heading, hInit=false;
    function frame(now){
      let k=(now-t0)/dur; if(k>1)k=1;
      const e=0.5-0.5*Math.cos(Math.PI*k);
      const sp=geoToPixel(sLng,sLat), tp=geoToPixel(tLng,tLat), cp=geoToPixel(ctrlLL.lng,ctrlLL.lat);
      const u=1-e;
      const gx=u*u*sp.x+2*u*e*cp.x+e*e*tp.x;
      const gy=u*u*sp.y+2*u*e*cp.y+e*e*tp.y;
      const tx=2*u*(cp.x-sp.x)+2*e*(tp.x-cp.x);
      const ty=2*u*(cp.y-sp.y)+2*e*(tp.y-cp.y);
      const rawH=Math.atan2(ty,tx)*180/Math.PI+90;
      const heading=hInit?lerpAngle(lastH,rawH,0.2):rawH;
      let dh=heading-lastH; while(dh>180)dh-=360; while(dh<-180)dh+=360;
      const bank=Math.max(-15,Math.min(15,dh*8));
      lastH=heading; hInit=true;
      const lift=CRUISE_LIFT;
      const x=gx, y=gy-lift;
      const gll=map.containerPointToLatLng([gx,gy]);
      plane.lng=gll.lng; plane.lat=gll.lat; plane.liftPx=lift; plane.alt=1;
      plane.heading=heading; plane.bank=bank; plane.scale=0.55;
      placePlane(x,y,heading,bank,0.55);
      puffAcc+=Math.hypot(x-prevX,y-prevY);
      if(puffAcc>26){ spawnTrail(prevX,prevY); puffAcc=0; }
      prevX=x; prevY=y;
      if(k<1) requestAnimationFrame(frame); else resolve();
    }
    requestAnimationFrame(frame);
  });
}

// 起飞：滑跑→抬轮→爬升
function takeoff(gLng,gLat,opts={}){
  return new Promise(resolve=>{
    const dur=opts.dur||2000, t0=performance.now();
    plane.geoLocked=true; plane.visible=true;
    dart.style.display='block';
    const g0=geoToPixel(gLng,gLat);
    let hdg=plane.heading||0;
    if(opts.toLng!=null&&opts.toLat!=null){
      const tp=geoToPixel(opts.toLng,opts.toLat);
      hdg=Math.atan2(tp.y-g0.y,tp.x-g0.x)*180/Math.PI+90;
    }
    const startH=plane.heading||hdg;
    const hRad=hdg*Math.PI/180;
    const fx=Math.sin(hRad), fy=-Math.cos(hRad);
    const ROLL=60, CLIMB_FWD=80;
    let prevX=g0.x, prevY=g0.y, puffAcc=0;
    function frame(now){
      let k=(now-t0)/dur; if(k>1)k=1;
      let fwd, lift, scale;
      const ROLLP=0.34;
      if(k<ROLLP){
        const t1=k/ROLLP, acc=t1*t1;
        fwd=ROLL*acc; lift=0; scale=0.42+0.06*t1;
      }else{
        const t2=(k-ROLLP)/(1-ROLLP), s=t2*t2*(3-2*t2);
        fwd=ROLL+CLIMB_FWD*s; lift=CRUISE_LIFT*s; scale=0.48+0.12*s;
      }
      const heading=lerpAngle(startH,hdg,Math.min(1,k/0.18));
      const g=geoToPixel(gLng,gLat);
      const groundX=g.x+fx*fwd, groundY=g.y+fy*fwd;
      const x=groundX, y=groundY-lift;
      const gll=map.containerPointToLatLng([groundX,groundY]);
      plane.lng=gll.lng; plane.lat=gll.lat; plane.liftPx=lift;
      plane.alt=lift/CRUISE_LIFT; plane.heading=heading; plane.bank=0; plane.scale=scale;
      placePlane(x,y,heading,0,scale);
      puffAcc+=Math.hypot(x-prevX,y-prevY);
      if(puffAcc>16){ spawnTrail(prevX,prevY+(lift>4?0:8)); puffAcc=0; }
      prevX=x; prevY=y;
      if(k<1) requestAnimationFrame(frame); else resolve();
    }
    requestAnimationFrame(frame);
  });
}

// 降落：巡航高度沿进近方向下降，带拉平收沉
function land(tLng,tLat,opts={}){
  return new Promise(resolve=>{
    const sLng=plane.lng, sLat=plane.lat, dur=opts.dur||1800, t0=performance.now();
    const startH=plane.heading, startBank=plane.bank;
    plane.geoLocked=true; plane.visible=true;
    dart.style.display='block';
    let prevX=plane.x, prevY=plane.y, puffAcc=0;
    function frame(now){
      let k=(now-t0)/dur; if(k>1)k=1;
      const e=k*k*(3-2*k);
      const lng=sLng+(tLng-sLng)*e, lat=sLat+(tLat-sLat)*e;
      const sp=geoToPixel(sLng,sLat), tp=geoToPixel(tLng,tLat);
      const g=geoToPixel(lng,lat);
      const approachH=Math.atan2(tp.y-sp.y,tp.x-sp.x)*180/Math.PI+90;
      const heading=lerpAngle(startH,approachH,Math.min(1,k/0.4));
      const flare=1-Math.pow(1-k,3);
      const lift=CRUISE_LIFT*(1-flare);
      const bank=(1-Math.min(1,k*2))*startBank*0.5;
      const x=g.x, y=g.y-lift;
      plane.lng=lng; plane.lat=lat; plane.heading=heading; plane.bank=bank;
      plane.liftPx=lift; plane.alt=1-flare; plane.scale=0.55-0.12*e;
      placePlane(x,y,heading,bank,plane.scale);
      puffAcc+=Math.hypot(x-prevX,y-prevY);
      if(puffAcc>26){ spawnTrail(prevX,prevY); puffAcc=0; }
      prevX=x; prevY=y;
      if(k<1) requestAnimationFrame(frame);
      else{
        const tp2=geoToPixel(tLng,tLat);
        plane.liftPx=0; plane.alt=0;
        showImpact(tp2.x,tp2.y);
        if(navigator.vibrate) navigator.vibrate(40);
        setTimeout(()=>resolve(),220);
      }
    }
    requestAnimationFrame(frame);
  });
}

// 盘旋：绕地理锚定圆心做匀速椭圆绕飞
function circle(cx,cy,opts={}){
  return new Promise(resolve=>{
    const R=opts.r||90, loops=opts.loops||1, dur=opts.dur||1700, t0=performance.now();
    const centerLL=map.containerPointToLatLng([cx,cy]);
    const startGround={x:plane.x, y:plane.y+CRUISE_LIFT};
    const a0=Math.atan2((startGround.y-cy)/0.6, startGround.x-cx);
    const blendP=0.16;
    plane.geoLocked=true; plane.visible=true;
    dart.style.display='block';
    const p=0.18;
    function angFrac(k){
      if(k<p) return (k*k)/(2*p)/(1-p);
      if(k>1-p){ const q=1-k; return 1-(q*q)/(2*p)/(1-p); }
      return (k-p/2)/(1-p);
    }
    let prevX=plane.x, prevY=plane.y, puffAcc=0, lastH=plane.heading, hInit=false;
    function frame(now){
      let k=(now-t0)/dur; if(k>1)k=1;
      const ang=a0+loops*2*Math.PI*angFrac(k);
      const c=geoToPixel(centerLL.lng,centerLL.lat);
      const ox=c.x+R*Math.cos(ang), oy=c.y+R*Math.sin(ang)*0.6;
      const blend=Math.min(1,k/blendP);
      const gx=blend>=1?ox:startGround.x+(ox-startGround.x)*blend;
      const gy=blend>=1?oy:startGround.y+(oy-startGround.y)*blend;
      const dir=loops>=0?1:-1;
      const rawH=Math.atan2(dir*0.6*Math.cos(ang),dir*(-Math.sin(ang)))*180/Math.PI+90;
      const heading=hInit?lerpAngle(lastH,rawH,0.25):rawH; lastH=heading; hInit=true;
      const bank=14*Math.min(1,k/0.14)*Math.min(1,(1-k)/0.14);
      const lift=CRUISE_LIFT;
      const x=gx, y=gy-lift;
      const gll=map.containerPointToLatLng([gx,gy]);
      plane.lng=gll.lng; plane.lat=gll.lat; plane.liftPx=lift; plane.alt=1;
      plane.heading=heading; plane.bank=bank; plane.scale=0.58;
      placePlane(x,y,heading,bank,0.58);
      puffAcc+=Math.hypot(x-prevX,y-prevY);
      if(puffAcc>26){ spawnTrail(prevX,prevY); puffAcc=0; }
      prevX=x; prevY=y;
      if(k<1) requestAnimationFrame(frame); else resolve({x:gx,y:gy,ang});
    }
    requestAnimationFrame(frame);
  });
}

/* =========================================================================
 *  主流程：飞机从出发地滑行起飞 → 盘旋 → 选中省份 → 飞向并降落省份
 *          → 地图放大 → 飞机从省会起飞 → 盘旋 → 选中城市 → 降落城市
 * ========================================================================= */
const btn = document.getElementById('throwBtn');
const statusEl = document.getElementById('status');
const d1=document.getElementById('d1'), d2=document.getElementById('d2');
const resultBox=document.getElementById('result');

function setStatus(s){ statusEl.innerHTML=s; }

btn.onclick = async ()=>{
  if(!GEO_LOADED){ setStatus('地图尚未加载完成，请稍候…'); return; }

  // 1. 计算符合所选地理大区的候选省份
  const provs = eligibleProvinces();
  if(provs.length===0){ setStatus('😕 当前地理大区下没有候选省份，请调整筛选'); return; }

  // 重置 UI：回到全国视图，标注省份 + 省会/主要城市
  btn.disabled=true; resultBox.style.display='none';
  viewMode='china';
  highlightProvince=null; highlightGeo=null; cityBorderGeo=null; cityMarks=[];
  attractionMarks=[]; attractionLinks=[];          // 清空上一轮旅游点位与连线
  labelMarks = [];                                   // 省名/省会已由常驻标注层显示，此处仅留地级市动态标注
  map.setView(CHINA_CENTER, CHINA_ZOOM);            // 复位卫星图到全国视图
  renderMap();
  hidePlane();                                       // 重置飞机
  d1.classList.remove('active'); d2.classList.remove('active');
  await wait(300);

  // 2. 先随机选取省份和城市（在飞机盘旋阶段完成选取逻辑，选中后飞机落地）
  const province = provs[Math.floor(Math.random()*provs.length)];
  const pc = regionCenter[province];                 // 省份官方中心（陆地）
  const depart = getDepart();                        // 出发地（默认北京，可配置）

  // 预加载该省地级市官方边界（与飞机起飞并行）
  let cityInfo;
  try{ cityInfo = await loadProvinceCities(province); }
  catch(e){ cityInfo=null; }

  /* ====== 阶段 1·飞机从出发城市起飞 ====== */
  const departPix = geoToPixel(depart.lng, depart.lat);
  plane.lng=depart.lng; plane.lat=depart.lat;
  plane.x=departPix.x; plane.y=departPix.y;
  plane.alt=0; plane.liftPx=0; plane.heading=0;
  plane.visible=true; plane.geoLocked=true;
  setStatus('🛫 飞机从 <b style=”color:#ffcc33”>'+depart.city+'</b> 滑行起飞…');
  showImpact(departPix.x, departPix.y);
  // 起飞航向朝向地图中心
  const rect=mapWrap.getBoundingClientRect();
  const mapCx=rect.width/2, mapCy=rect.height/2;
  const ctrLL=map.containerPointToLatLng([mapCx,mapCy]);
  await takeoff(depart.lng, depart.lat, {toLng:ctrLL.lng, toLat:ctrLL.lat, dur:2200});

  /* ====== 阶段 2·飞机在全国视图上空盘旋（此时选取结果已确定但尚未展示） ====== */
  setStatus('🌀 飞机正在上空盘旋，搜索目的地中…');
  const mapR=Math.min(rect.width,rect.height)*0.28;
  await circle(mapCx, mapCy, {r:mapR, loops:0.6, dur:3500});

  /* ====== 阶段 3·飞机飞向选中省份并降落 ====== */
  setStatus('🛬 选中 <b style=”color:#ffcc33”>'+province+'</b>，飞机正在降落…');
  await flyPlane(pc[0], pc[1], {dur:5000, arc:70, route:'ns'});
  await land(pc[0], pc[1], {dur:1800});

  // 高亮命中省份
  highlightProvince = province; highlightGeo = provinceFeature(province); renderMap();
  d1.classList.add('active');
  setStatus('✅ 已定位 <b style=”color:#ffcc33”>'+province+'</b>，正在加载地级行政区…');

  await wait(600);

  /* ====== 丝滑过渡放大：Leaflet 原生 flyTo ====== */
  setStatus('🔍 放大地图，进入 <b style=”color:#ffcc33”>'+province+'</b>…');
  if(cityInfo && cityInfo.geo){ cityBorderGeo = cityInfo.geo; renderMap(); }
  await animateZoom(6, pc, 1600);        // 省级层级（卫星图同步放大）

  // 在放大的卫星图上叠加该省地级市标注 + 全省旅游胜地。
  if(cityInfo && cityInfo.cities.length){
    labelMarks = cityInfo.cities.map(c=>({name:c.name, value:[c.lng,c.lat]}));
    attractionMarks = provinceAttractionMarks(province);  // 省份层级：全省旅游胜地
    attractionLinks = [];                                 // 省份层级不连线
    renderMap();
    if(attractionMarks.length){
      setStatus('🗺️ <b style=”color:#ff5d73”>'+province+'</b> 共标注 '+attractionMarks.length+' 处旅游胜地');
    }
  }
  await wait(800);

  /* ====== 4. 随机选取城市，飞机从省会起飞→盘旋→降落城市 ====== */
  const cap = CAPITALS[province];                     // 省会/首府（官方行政中心）
  const provAttr = ATTRACTIONS[province]||[];
  const attrCities = [...new Set(provAttr.map(a=>a.city))];
  const geoCities = (cityInfo && cityInfo.cities.length) ? cityInfo.cities : [cap];
  let city;
  if(attrCities.length){
    const pickName = attrCities[Math.floor(Math.random()*attrCities.length)];
    city = geoCities.find(c=>c.name===pickName)
        || {name:pickName, ...(provAttr.find(a=>a.city===pickName))};
  }else{
    city = geoCities[Math.floor(Math.random()*geoCities.length)];
  }

  // 飞机从省会起飞 → 省内盘旋 → 降落选中城市
  const capPix = geoToPixel(cap.lng, cap.lat);
  plane.lng=cap.lng; plane.lat=cap.lat;
  plane.x=capPix.x; plane.y=capPix.y;
  plane.alt=0; plane.liftPx=0; plane.visible=true; plane.geoLocked=true;
  setStatus('🛫 飞机从省会 <b style=”color:#ffcc33”>'+cap.city+'</b> 起飞，省内巡游…');
  await takeoff(cap.lng, cap.lat, {toLng:city.lng, toLat:city.lat, dur:2000});

  // 省内小半径盘旋
  const rectP=mapWrap.getBoundingClientRect();
  const provCx=geoToPixel(pc[0], pc[1]);
  const provR=Math.min(rectP.width,rectP.height)*0.15;
  setStatus('🌀 飞机在 <b style=”color:#ffcc33”>'+province+'</b> 上空盘旋…');
  await circle(provCx.x, provCx.y, {r:provR, loops:0.5, dur:3000});

  // 飞向并降落选中城市
  cityMarks=[{name:city.name, value:[city.lng,city.lat]}]; renderMap();
  setStatus('🛬 选中 <b style=”color:#ffcc33”>'+city.name+'</b>，飞机降落中…');
  await flyPlane(city.lng, city.lat, {dur:3000, arc:40});
  await land(city.lng, city.lat, {dur:1800});
  d2.classList.add('active');
  plane.geoLocked=false;

  /* ====== 5. 下钻到市级层级：放大地图并连线串联该市全部旅游点位 ====== */
  const cityAttr = cityAttractions(province, city.name);
  if(cityAttr.marks.length){
    attractionMarks = cityAttr.marks;                // 市级层级：仅该市旅游点位
    attractionLinks = cityAttr.coords;               // 连线串联该市所有点位
    await animateZoom(9, [city.lng, city.lat], 1300);    // 市级层级（卫星图同步放大）
    renderMap();
    setStatus('🧭 <b style=”color:#ff5d73”>'+city.name+'</b> 旅游线路已串联 '+cityAttr.marks.length+' 个点位');
    await wait(600);
  }else{
    await animateZoom(8, [city.lng, city.lat], 1300);
    renderMap();
    await wait(400);
  }

  /* ====== 6. 展示最终结果（行政信息 + 旅游线路，浮于底部居中） ====== */
  const spotCount = attractionLinks.length;
  document.getElementById('rProv').textContent='📍 '+(REGION_OF[province]||'')+' · '+province+'（出发地：'+depart.city+'）';
  document.getElementById('rCity').textContent=city.name;
  document.getElementById('rDesc').textContent = spotCount
    ? ('已为你串联 '+spotCount+' 个旅游点位：'+attractionMarks.map(a=>a.name).join(' → '))
    : ('经度 '+city.lng.toFixed(3)+'°E，纬度 '+city.lat.toFixed(3)+'°N（官方行政区划中心点）');
  const rt=document.getElementById('rTags'); rt.innerHTML='';
  [province, (city.name===cap.city?'省会/首府':'地级行政区'), (spotCount?'旅游线路':'行政中心')].forEach(t=>{
    const s=document.createElement('span');s.textContent='#'+t;rt.appendChild(s);
  });
  // V4：填充「当地推荐景点 + 旅行攻略」，并默认展开最新结果
  renderResultMore(province, city, cap);
  resultBox.classList.remove('collapsed');                 // 默认展开最新内容
  document.getElementById('rMoreLabel').textContent='收起景点与攻略';
  resultBox.style.display='block';
  setStatus('🎉 目的地已选取：<b style=”color:#ff5d73”>'+city.name+'</b>');

  // 收集详细攻略数据用于历史记录
  const guideData = collectGuideData(province, city, cap);
  // N6：记录本次选取结果并写入历史
  addHistory({
    province, region:(REGION_OF[province]||''), city:city.name, depart:depart.city,
    spots: attractionMarks.map(a=>a.name), ts: Date.now(),
    detail: guideData
  });
  btn.disabled=false;
};

/* =========================================================================
 *  V4：结果页「当地推荐景点 + 旅行攻略」渲染 + 折叠交互
 * ========================================================================= */
// 渲染推荐景点列表与旅行攻略（默认随结果展开）
function renderResultMore(province, city, cap){
  // 1) 当地推荐景点：优先该城市的点位，不足时补充全省代表景点
  const all = ATTRACTIONS[province] || [];
  const cityName = city.name;
  let spots = all.filter(a=>a.city===cityName);
  if(spots.length<3){
    const extra = all.filter(a=>a.city!==cityName);
    spots = spots.concat(extra).slice(0, Math.max(spots.length, 5));
  }
  spots = spots.slice(0,6);
  const spotBox=document.getElementById('rSpots');
  if(spots.length){
    spotBox.innerHTML = spots.map(a=>
      `<div class="sp"><span class="si">★</span><span class="sn">${a.name}</span>`
      + `<span class="sc">${a.city||''}</span></div>`).join('');
  }else{
    spotBox.innerHTML = `<div class="sp"><span class="si">★</span>`
      + `<span class="sn">${cityName}市区及周边</span>`
      + `<span class="sc">行政中心</span></div>`;
  }
  // 2) 推荐旅行路线：以「出发城市 → 各景点」为顺序，箭头串联，形成可执行的游览动线
  const routeBox=document.getElementById('rRoute');
  if(routeBox){
    const seq=[cityName].concat(spots.map(a=>a.name));
    routeBox.innerHTML = seq.map((n,i)=>
      (i? `<span class="arr2">→</span>`:``)
      + `<span class="rt">${n}</span>`).join('');
  }
  // 3) 对应景点真实照片：全部使用维基共享资源实拍图（绝不使用 SVG/图标），加载失败回退通用中国风景实拍图
  const photoBox=document.getElementById('rPhotos');
  if(photoBox){
    if(spots.length){
      photoBox.innerHTML = spots.slice(0,6).map(a=>{
        const src=spotRealPhoto(a.name);
        return `<figure><img loading="lazy" src="${src}" alt="${a.name}" `
          + `onerror="this.onerror=null;this.src='${FALLBACK_PHOTO}';"/>`
          + `<figcaption>${a.name}</figcaption></figure>`;
      }).join('');
    }else{
      photoBox.innerHTML = `<figure><img src="${spotRealPhoto(cityName)}" alt="${cityName}" `
        + `onerror="this.onerror=null;this.src='${FALLBACK_PHOTO}';"/>`
        + `<figcaption>${cityName}</figcaption></figure>`;
    }
  }
  // 4) 详细旅行攻略：行程天数规划 + 最佳季节 / 特色美食 / 出行贴士
  const g=getGuide(province);
  // 依据推荐景点自动拆分为 D1/D2/D3… 每日游览安排（每天 2 个景点，更可执行）
  const planSpots = spots.length ? spots : [{name:cityName+'市区及周边'}];
  const days=[]; for(let i=0;i<planSpots.length;i+=2){ days.push(planSpots.slice(i,i+2)); }
  const dayHtml = days.map((d,i)=>{
    const names=d.map(s=>s.name).join(' → ');
    const tag = i===0 ? '抵达 & 核心景点' : (i===days.length-1 ? '深度游 & 返程' : '周边延展');
    return `<li>📅 <b>第 ${i+1} 天</b>（${tag}）：${names}</li>`;
  }).join('');
  document.getElementById('rGuide').innerHTML =
      `<li class="g-h">🚄 <b>建议行程（约 ${days.length} 天）</b></li>`
    + dayHtml
    + `<li class="g-h">🌟 <b>实用信息</b></li>`
    + `<li>🗓️ <b>最佳季节</b>：${g.season}</li>`
    + `<li>🍜 <b>特色美食</b>：${g.food}</li>`
    + `<li>💡 <b>出行贴士</b>：${g.tip}</li>`
    + `<li>🎒 <b>行前准备</b>：提前订票订房、错峰出行、备好身份证件与常用药品</li>`
    + `<li>🚗 <b>交通建议</b>：城际优先高铁/动车，市内景点间可包车或打车，山岳景区留意班车末班时间</li>`;
}
// 折叠/展开切换
(function(){
  const tog=document.getElementById('rMoreToggle');
  if(tog) tog.onclick=()=>{
    const collapsed=resultBox.classList.toggle('collapsed');

// 收集详细攻略数据（用于历史记录展开显示）
function collectGuideData(province, city, cap){
  const all = ATTRACTIONS[province] || [];
  const cityName = city.name;
  let spots = all.filter(a=>a.city===cityName);
  if(spots.length<3){
    const extra = all.filter(a=>a.city!==cityName);
    spots = spots.concat(extra).slice(0, Math.max(spots.length, 5));
  }
  spots = spots.slice(0,6);
  const g=getGuide(province);
  const planSpots = spots.length ? spots : [{name:cityName+'市区及周边'}];
  const days=[]; for(let i=0;i<planSpots.length;i+=2){ days.push(planSpots.slice(i,i+2)); }
  const dayHtml = days.map((d,i)=>{
    const names=d.map(s=>s.name).join(' → ');
    const tag = i===0 ? '抵达 & 核心景点' : (i===days.length-1 ? '深度游 & 返程' : '周边延展');
    return `<li>📅 <b>第 ${i+1} 天</b>（${tag}）：${names}</li>`;
  }).join('');
  const guideHtml =
      `<li class="g-h">🚄 <b>建议行程（约 ${days.length} 天）</b></li>`
    + dayHtml
    + `<li class="g-h">🌟 <b>实用信息</b></li>`
    + `<li>🗓️ <b>最佳季节</b>：${g.season}</li>`
    + `<li>🍜 <b>特色美食</b>：${g.food}</li>`
    + `<li>💡 <b>出行贴士</b>：${g.tip}</li>`;
  // 照片列表
  const photos = (spots.length?spots:[{name:cityName}]).slice(0,6).map(a=>({
    name:a.name, src:spotRealPhoto(a.name)
  }));
  // 路线
  const route = [cityName].concat(spots.map(a=>a.name));
  return { spots: spots.map(a=>({name:a.name, city:a.city||''})), route, photos, guideHtml };
}

/* =========================================================================
 *  N6：结果历史抽屉——收集最近选取结果、按时间分类、支持清空
 * ========================================================================= */
const HISTORY_KEY='flightHistory', HISTORY_MAX=50;
let historyList=[];
// 读取本地持久化历史
try{ historyList = JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]'); }catch(e){ historyList=[]; }

function saveHistory(){ try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(historyList)); }catch(e){} }
function addHistory(rec){
  historyList.unshift(rec);
  if(historyList.length>HISTORY_MAX) historyList.length=HISTORY_MAX;
  saveHistory();
  renderHistory();
}
// 按"今天 / 昨天 / 更早"分类（基于本地时区日界）
function dayBucket(ts){
  const d=new Date(ts), n=new Date();
  const startOf=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
  const diff=Math.round((startOf(n)-startOf(d))/86400000);
  if(diff<=0) return '今天';
  if(diff===1) return '昨天';
  return '更早';
}
function fmtTime(ts){
  const d=new Date(ts);
  const p=x=>String(x).padStart(2,'0');
  return p(d.getHours())+':'+p(d.getMinutes());
}
function renderHistory(){
  const body=document.getElementById('drawerBody');
  const clearBtn=document.getElementById('drawerClear');
  if(!historyList.length){
    body.innerHTML='<div class="dempty">暂无选取记录，点击「随机选取」开始你的随机旅行吧 🎯</div>';
    if(clearBtn) clearBtn.disabled=true;
    return;
  }
  if(clearBtn) clearBtn.disabled=false;
  // 按时间分组
  const groups={'今天':[],'昨天':[],'更早':[]};
  historyList.forEach(r=>groups[dayBucket(r.ts)].push(r));
  let html='';
  let globalIdx=0;     // 全局序号，用于判断是否为最新记录（最新默认展开）
  ['今天','昨天','更早'].forEach(g=>{
    if(!groups[g].length) return;
    html+='<div class="dgroup"><div class="gtitle">'+g+' · '+groups[g].length+' 次</div>';
    groups[g].forEach(r=>{
      const isFirst = globalIdx===0;   // 最新记录默认展开
      globalIdx++;
      const spots = r.spots&&r.spots.length ? r.spots : [];
      const d = r.detail;   // 详细攻略数据
      // 推荐景点列表
      let spotsHtml='';
      if(d && d.spots && d.spots.length){
        spotsHtml = d.spots.map(s=>
          `<div class="sp"><span class="si">★</span><span class="sn">${s.name}</span></div>`
        ).join('');
      }else if(spots.length){
        spotsHtml = spots.map(s=>
          `<div class="sp"><span class="si">★</span><span class="sn">${s}</span></div>`
        ).join('');
      }
      // 旅行路线
      let routeHtml='';
      if(d && d.route && d.route.length){
        routeHtml = d.route.map((n,i)=>
          (i?`<span class="arr2">→</span>`:``)+`<span class="rt">${n}</span>`
        ).join('');
      }
      // 照片网格
      let photosHtml='';
      if(d && d.photos && d.photos.length){
        photosHtml = d.photos.map(p=>
          `<figure><img loading="lazy" src="${p.src}" alt="${p.name}" `
          + `onerror="this.onerror=null;this.src='${FALLBACK_PHOTO}';"/>`
          + `<figcaption>${p.name}</figcaption></figure>`
        ).join('');
      }
      // 攻略
      const guideHtml = (d && d.guideHtml) ? d.guideHtml : '';

      html+=`<div class="hcard${isFirst?'':' collapsed'}" data-idx="${globalIdx-1}">`
          +`<div class="hc-top"><span class="hc-city">${r.city}</span>`
          +`<span class="hc-time">${fmtTime(r.ts)}</span></div>`
          +`<div class="hc-meta">${(r.region?r.region+' · ':'')+r.province}　|　出发：${r.depart}</div>`
          +(spots.length?`<div class="hc-spots">🗺️ ${spots.join(' → ')}</div>`:'')
          +`<div class="hc-toggle"><span class="arr">▾</span><span>${isFirst?'收起详情':'展开详情'}</span></div>`
          +`<div class="hc-detail">`
          +(spotsHtml?`<div class="hc-spots-list">${spotsHtml}</div>`:'')
          +(routeHtml?`<div class="hc-route">${routeHtml}</div>`:'')
          +(photosHtml?`<div class="hc-photos">${photosHtml}</div>`:'')
          +(guideHtml?`<ul class="hc-guide">${guideHtml}</ul>`:'')
          +`</div></div>`;
    });
    html+='</div>';
  });
  body.innerHTML=html;
  // 绑定展开/折叠点击
  body.querySelectorAll('.hcard').forEach(card=>{
    card.onclick=(e)=>{
      // 点击详情区域内部不触发折叠
      if(e.target.closest('.hc-detail')||e.target.closest('.hc-toggle')) {
        // 点击 toggle 区域切换
        if(e.target.closest('.hc-toggle')){
          const collapsed=card.classList.toggle('collapsed');
          const label=card.querySelector('.hc-toggle span:last-child');
          if(label) label.textContent=collapsed?'展开详情':'收起详情';
        }
        return;
      }
      const collapsed=card.classList.toggle('collapsed');
      const label=card.querySelector('.hc-toggle span:last-child');
      if(label) label.textContent=collapsed?'展开详情':'收起详情';
    };
  });
}
// 抽屉开关与清空
const drawer=document.getElementById('drawer');
document.getElementById('historyBtn').onclick=()=>{ closeAllDrawers('drawer'); drawer.classList.add('open'); renderHistory(); };
document.getElementById('drawerClose').onclick=()=>drawer.classList.remove('open');
document.getElementById('drawerClear').onclick=()=>{
  historyList=[]; saveHistory(); renderHistory();
};
renderHistory();   // 初始渲染（含历史持久化数据）

function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
</script>
