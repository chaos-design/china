<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四渡赤水战役 · 交互式战争沙盘</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#0d1117;color:#e6edf3;overflow:hidden;height:100vh;user-select:none}
#app{display:flex;flex-direction:column;height:100vh}
#header{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:8px 20px;border-bottom:2px solid #e74c3c;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:1000}
#header h1{font-size:18px;color:#e74c3c;letter-spacing:2px}
#header .sub{font-size:11px;color:#8b949e;margin-top:2px}
#header .legend{display:flex;gap:14px;font-size:11px;align-items:center}
#header .legend span{display:flex;align-items:center;gap:4px}
#header .legend .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.dot-red{background:#e74c3c}.dot-blue{background:#3498db}.dot-cross{background:#f39c12;border-radius:0;transform:rotate(45deg);width:9px;height:9px}
#main{flex:1;display:flex;overflow:hidden;position:relative}
#map-wrap{flex:1;position:relative;overflow:hidden}
#map{width:100%;height:100%;background:#0a0a0a;z-index:1}
/* v20: 信息面板 — 标题固定，详情滚动 */
#info-panel{width:320px;background:#0d1117;border-left:1px solid #30363d;display:flex;flex-direction:column;flex-shrink:0;z-index:500}
#stage-info{flex-shrink:0;padding:14px 14px 10px;border-bottom:1px solid #30363d}
#i-details{flex:1;overflow-y:auto;padding:10px 14px 14px}
#i-details::-webkit-scrollbar{width:6px}
#i-details::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
#info-panel h2{font-size:15px;color:#f39c12;margin-bottom:3px;line-height:1.4}
#info-panel .s-date{font-size:11px;color:#8b949e;margin-bottom:8px}
#info-panel .s-desc{font-size:12px;line-height:1.75;color:#c9d1d9;text-indent:2em}
.unit-card{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:10px;margin:8px 0;cursor:pointer;transition:all .2s}
.unit-card:hover{border-color:#58a6ff;background:#1c2333}
.unit-card .uc-head{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:bold}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:9px}
.tag-r{background:#e74c3c;color:#fff}.tag-b{background:#3498db;color:#fff}
#controls{background:#161b22;border-top:1px solid #30363d;padding:8px 16px;display:flex;flex-direction:row;align-items:stretch;gap:0;flex-shrink:0;z-index:1000}
/* 左侧控制按钮两行，靠左 */
#ctrl-left{display:flex;flex-direction:column;gap:4px;flex-shrink:0;width:260px}
.ctrl-row{display:flex;align-items:center;gap:6px}
.ctrl-row .btn,.ctrl-row .speed-sel{flex:1;min-width:0;text-align:center;padding:7px 0;font-size:12px}
.btn{background:#21262d;border:1px solid #30363d;color:#c9d1d9;border-radius:6px;cursor:pointer;transition:all .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn:hover{background:#30363d;border-color:#58a6ff}
.btn:active{transform:scale(.96)}
.btn-pause{background:#e74c3c;border-color:#e74c3c;color:#fff}
.btn-follow{background:#238636;border-color:#238636;color:#fff}
.btn-follow:hover{background:#2ea043;border-color:#2ea043;color:#fff}
.btn-follow.inactive{background:#21262d;border-color:#30363d;color:#8b949e}
.btn-follow.inactive:hover{background:#30363d;color:#c9d1d9}
#timeline-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;padding:0 16px 0 32px}
/* 右侧阶段信息，靠右（v18: 缩窄宽度，增加日期） */
#stage-right{display:flex;flex-direction:column;justify-content:center;gap:2px;flex-shrink:0;width:140px;text-align:right}
#stage-right .sr-line{font-size:12px;color:#8b949e;line-height:1.4}
#stage-right .sr-line b{color:#f39c12}
#stage-right .sr-name{font-size:13px;color:#e74c3c;font-weight:bold;line-height:1.3}
#stage-right .sr-date{font-size:10px;color:#8b949e;line-height:1.3;font-family:"Consolas","Monaco",monospace}
/* v17: 时间轴 — 标签上下错位（偶数轴上，奇数轴下），修复定位 */
#timeline-container{flex:1;position:relative;height:80px;display:flex;align-items:flex-start;padding-top:22px;min-width:0}
#timeline{width:100%;-webkit-appearance:none;appearance:none;height:6px;background:linear-gradient(90deg,#e74c3c 0%,#f39c12 18%,#e74c3c 36%,#f39c12 54%,#e74c3c 72%,#f39c12 90%,#e74c3c 100%);border-radius:3px;outline:none;cursor:pointer;position:absolute;top:36px;left:0;z-index:2;margin:0}
#timeline::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#e74c3c;cursor:pointer;border:2px solid #fff;box-shadow:0 0 8px rgba(231,76,60,.8);z-index:5;position:relative}
#timeline::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#e74c3c;cursor:pointer;border:2px solid #fff;box-shadow:0 0 8px rgba(231,76,60,.8)}
#timeline-ticks{position:absolute;top:0;left:0;right:0;height:80px;pointer-events:none;display:flex;justify-content:space-between;z-index:1}
.tick{position:relative;width:1px;height:80px}
.tick-line{width:2px;height:6px;background:#4a5568;border-radius:1px;position:absolute;top:36px;left:50%;transform:translateX(-50%)}
.tick.battle .tick-line{background:#f39c12;height:10px;box-shadow:0 0 4px rgba(243,156,18,.6)}
.tick.crossing .tick-line{background:#e74c3c;height:12px;width:3px;box-shadow:0 0 6px rgba(231,76,60,.8)}
.tick-label{font-size:9px;color:#8b949e;white-space:nowrap;position:absolute;left:50%;transform:translateX(-50%);font-family:"Consolas","Monaco",monospace;line-height:1.3;text-align:center}
/* 轴上方：偶数索引 — 时间轴在 top:36px，标签需在 36px 以上 */
.tick-label.above{bottom:50px;top:auto}
/* 轴下方：奇数索引 — 时间轴底部在 42px，标签在 42px 以下 */
.tick-label.below{top:48px;bottom:auto}
.tick.battle .tick-label{color:#f39c12;font-weight:bold}
.tick.crossing .tick-label{color:#e74c3c;font-weight:bold}
.tick.active .tick-label{color:#e74c3c;font-weight:bold;font-size:10px}
/* v14: 旧的 stage-label 已移除，由 stage-right 替代 */
.speed-sel{background:#21262d;border:1px solid #30363d;color:#c9d1d9;border-radius:6px;font-size:12px;text-align:center;text-align-last:center}

/* 部队标记 */
.unit-marker{background:transparent;border:none}
.unit-marker .um-body{
  width:18px;height:18px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:bold;color:#fff;
  border:2px solid;box-shadow:0 1px 4px rgba(0,0,0,.5);
  position:relative;transition:transform .2s,box-shadow .2s;
  will-change:transform;
}
.unit-marker .um-body::after{
  content:'';position:absolute;top:-3px;left:-3px;right:-3px;bottom:-3px;
  border-radius:50%;border:1.5px solid;opacity:0;
  animation:unitPulse 2s ease-in-out infinite;
}
/* v22: 红军标记 — 五角星中间带数字，军委为黄色星（v23: 放大数字、改用深色高对比）*/
.unit-marker.red .um-body{background:#e74c3c;border-color:#ff6b6b}
.unit-marker.red .um-body::after{border-color:#e74c3c}
.unit-marker.red.junwei .um-body{background:#f39c12;border-color:#ffd700;box-shadow:0 0 8px rgba(243,156,18,.7),0 1px 4px rgba(0,0,0,.5)}
.unit-marker.red.junwei .um-body::after{border-color:#f39c12}
.unit-marker.red .um-star{font-size:16px;line-height:1;position:relative;display:flex;align-items:center;justify-content:center}
.unit-marker.red .um-num{position:absolute;font-size:10px;font-weight:900;color:#fff;text-shadow:0 0 3px rgba(0,0,0,1),0 1px 2px rgba(0,0,0,.9);-webkit-text-stroke:.5px #8b0000}
.unit-marker.red.junwei .um-num{color:#5c3d00;text-shadow:0 0 3px rgba(255,255,255,.8),0 1px 2px rgba(0,0,0,.5);-webkit-text-stroke:.5px #b8860b}
.unit-marker.blue .um-body{background:#3498db;border-color:#5dade2}
.unit-marker.blue .um-body::after{border-color:#3498db}
.unit-marker .um-body:hover{transform:scale(1.5);box-shadow:0 2px 12px rgba(0,0,0,.8);z-index:9999}
@keyframes unitPulse{0%,100%{opacity:0;transform:scale(1)}50%{opacity:.4;transform:scale(1.3)}}

/* Hover tooltip - 动态位置 */
.unit-tooltip{
  position:absolute;
  background:rgba(13,17,23,.95);
  border:1px solid #58a6ff;border-radius:6px;
  padding:8px 12px;font-size:11px;color:#c9d1d9;
  pointer-events:none;opacity:0;
  transition:opacity .2s;z-index:10000;
  line-height:1.6;box-shadow:0 2px 8px rgba(0,0,0,.6);
  max-width:240px;max-height:180px;overflow-y:auto;
  display:none;
}
.unit-tooltip.visible{opacity:1}
.unit-tooltip .ut-name{color:#f39c12;font-weight:bold;font-size:13px;margin-bottom:3px}
.unit-tooltip .ut-row{color:#8b949e;font-size:10px;margin:1px 0}
.unit-tooltip .ut-row b{color:#c9d1d9}
.unit-tooltip .ut-desc{color:#8b949e;font-size:10px;margin-top:3px;line-height:1.5;white-space:normal}
.unit-tooltip::-webkit-scrollbar{width:3px}
.unit-tooltip::-webkit-scrollbar-thumb{background:#30363d;border-radius:2px}

/* 地点标记 */
.loc-marker{background:transparent;border:none}
.loc-marker .lm-dot{width:8px;height:8px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 3px rgba(0,0,0,.6)}
.loc-marker.crossing .lm-dot{background:#f39c12;border-color:#ffd700;transform:rotate(45deg);border-radius:1px}
.loc-marker.city .lm-dot{background:#e74c3c;border-color:#ff9999}
.loc-marker.town .lm-dot{background:#95a5a6;border-color:#bdc3c7}
.loc-marker.battle .lm-dot{background:#e74c3c;border-color:#ffd700}
.loc-marker .lm-label{position:absolute;top:50%;left:20px;transform:translateY(-50%);white-space:nowrap;font-size:10px;color:#fff;background:rgba(0,0,0,.7);padding:1px 5px;border-radius:2px;pointer-events:none;font-weight:bold;text-shadow:0 0 2px #000}
.loc-marker.major .lm-label{font-size:12px;background:rgba(231,76,60,.8);padding:1px 6px}

/* 蒋介石督战标记 */
.chieftain-marker{background:transparent;border:none}
.chieftain-marker .cm-body{font-size:16px;cursor:pointer;filter:drop-shadow(0 0 4px #e74c3c);animation:chieftainPulse 2s ease-in-out infinite}
@keyframes chieftainPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.chieftain-marker .cm-label{position:absolute;top:18px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;color:#e74c3c;background:rgba(0,0,0,.85);padding:1px 5px;border-radius:3px;pointer-events:none;font-weight:bold;border:1px solid #e74c3c}

.battle-marker{background:transparent;border:none}
.battle-marker .bm-icon{font-size:18px;color:#f39c12;text-shadow:0 0 8px #f39c12,0 0 4px #000;animation:battlePulse 1.5s ease-in-out infinite;cursor:pointer}
@keyframes battlePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.battle-marker .bm-label{position:absolute;top:20px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10px;color:#f39c12;background:rgba(0,0,0,.85);padding:1px 5px;border-radius:3px;pointer-events:none;font-weight:bold;border:1px solid #f39c12}

.phase-overlay{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(26,26,46,.92);border:1px solid #f39c12;border-radius:8px;padding:6px 24px;z-index:600;pointer-events:none;text-align:center;backdrop-filter:blur(4px)}
.phase-overlay .po-num{font-size:11px;color:#8b949e}
.phase-overlay .po-name{font-size:15px;color:#f39c12;font-weight:bold;margin-top:2px}
.phase-overlay .po-date{font-size:10px;color:#8b949e;margin-top:2px}
/* v26: 小时级时钟（纯展示，不驱动地图/阶段） */
.phase-overlay .po-clock{font-size:11px;color:#f39c12;margin-top:3px;font-family:"Consolas","Monaco",monospace;letter-spacing:.5px}
.phase-overlay .po-clock b{color:#fff}
/* v26: 渡赤水特写面板 —— 位于地图左下角，不影响原有控件布局 */
#crossing-closeup{position:absolute;bottom:110px;left:10px;width:300px;background:rgba(13,17,23,.94);border:1px solid #f39c12;border-radius:10px;padding:10px 12px;z-index:800;display:none;box-shadow:0 4px 22px rgba(0,0,0,.65);backdrop-filter:blur(4px)}
#crossing-closeup.visible{display:block;animation:ccIn .3s ease-out}
@keyframes ccIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
#crossing-closeup .cc-head{display:flex;align-items:center;gap:8px}
#crossing-closeup .cc-badge{background:#e74c3c;color:#fff;font-size:10px;font-weight:bold;padding:2px 6px;border-radius:3px;letter-spacing:1px;white-space:nowrap}
#crossing-closeup .cc-name{font-size:13px;color:#f39c12;font-weight:bold}
#crossing-closeup .cc-replay{margin-left:auto;background:#21262d;border:1px solid #f39c12;color:#f39c12;border-radius:4px;font-size:10px;padding:1px 6px;cursor:pointer;white-space:nowrap}
#crossing-closeup .cc-replay:hover{background:#f39c12;color:#0d1117}
#crossing-closeup .cc-ford{font-size:10px;color:#8b949e;margin:4px 0 8px}
#crossing-closeup .cc-scene{position:relative;height:88px;border:1px solid #30363d;border-radius:6px;overflow:hidden;background:#0a0f16}
#crossing-closeup .cc-bank{position:absolute;top:0;bottom:0;width:24%;background:repeating-linear-gradient(45deg,#2b2418,#2b2418 4px,#231d13 4px,#231d13 8px)}
#crossing-closeup .cc-bank.a{left:0}
#crossing-closeup .cc-bank.b{right:0}
#crossing-closeup .cc-bank .cc-bank-txt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:9px;color:#e8c98a;white-space:nowrap;text-align:center;line-height:1.3;text-shadow:0 1px 2px #000}
#crossing-closeup .cc-river{position:absolute;top:0;bottom:0;left:24%;right:24%;background:linear-gradient(180deg,#123a52,#0d2b40);overflow:hidden}
#crossing-closeup .cc-river .cc-wave{position:absolute;left:-20%;width:140%;height:1px;background:rgba(93,173,226,.45);animation:ccFlow 2.4s linear infinite}
#crossing-closeup .cc-river .cc-wave.w2{top:55%;animation-duration:3.2s}
#crossing-closeup .cc-river .cc-wave.w3{top:78%;animation-duration:2.8s}
#crossing-closeup .cc-river .cc-wave.w1{top:28%}
@keyframes ccFlow{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
#crossing-closeup .cc-river .cc-river-name{position:absolute;top:4px;left:50%;transform:translateX(-50%);font-size:9px;color:#5dade2;font-style:italic;white-space:nowrap}
#crossing-closeup .cc-dot{position:absolute;top:50%;left:22%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#e74c3c;border:2px solid #ffb3b3;color:#fff;font-size:9px;font-weight:bold;display:flex;align-items:center;justify-content:center;box-shadow:0 0 8px rgba(231,76,60,.8);transition:left .35s linear,top .35s linear;z-index:3}
#crossing-closeup .cc-dot.west{border-color:#ffd700;background:#f39c12;color:#3b2600}
#crossing-closeup .cc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:10px;color:#8b949e}
#crossing-closeup .cc-clock{color:#f39c12;font-family:"Consolas","Monaco",monospace;font-weight:bold;font-size:11px}
#crossing-closeup .cc-status{flex:1;text-align:right;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-left:6px}
#crossing-closeup .cc-status b{color:#fff}
.river-label{background:transparent;border:none}
.river-label .rl-text{font-size:13px;color:#5dade2;font-weight:bold;text-shadow:0 0 4px #000,0 0 4px #000,0 0 4px #000;white-space:nowrap;font-style:italic}

/* v6: 军事箭头标记 */
.arrow-marker{background:transparent;border:none}
.arrow-marker .am-svg{display:block;overflow:visible}

.leaflet-popup-content-wrapper{background:#161b22;color:#c9d1d9;border:1px solid #30363d;border-radius:8px}
.leaflet-popup-tip{background:#161b22}
.leaflet-popup-content{margin:10px 14px;font-size:12px;line-height:1.6}
.leaflet-popup-content h4{color:#f39c12;margin-bottom:4px}
.leaflet-popup-content .pop-row{font-size:11px;color:#8b949e;margin:2px 0}
.leaflet-popup-content .pop-row b{color:#c9d1d9}
.leaflet-control-layers{background:#161b22!important;color:#c9d1d9!important;border:1px solid #30363d!important;border-radius:6px!important}
.leaflet-control-layers-expanded{padding:8px 12px!important;font-size:11px!important}
.leaflet-control-attribution{font-size:9px!important;background:rgba(13,17,23,.7)!important;color:#8b949e!important}
.leaflet-control-attribution a{color:#58a6ff!important}
.leaflet-control-scale-line{background:rgba(13,17,23,.7)!important;color:#c9d1d9!important;border-color:#30363d!important;font-size:10px!important}

.explosion-fireball{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:9000}
@keyframes explosionFireball{0%{width:5px;height:5px;opacity:1}30%{width:40px;height:40px;opacity:1}100%{width:80px;height:80px;opacity:0}}
.explosion-shockwave{position:absolute;border-radius:50%;transform:translate(-50%,-50%);border:3px solid #ff9800;pointer-events:none;z-index:9000}
@keyframes explosionShock{0%{width:5px;height:5px;opacity:1;border-width:4px}100%{width:100px;height:100px;opacity:0;border-width:1px}}
.explosion-flash{position:absolute;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,255,255,.8) 0%,rgba(255,235,59,.3) 30%,transparent 70%);pointer-events:none;z-index:9000}
@keyframes explosionFlash{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
.explosion-smoke{position:absolute;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(80,80,80,.5) 0%,rgba(40,40,40,.2) 50%,transparent 100%);pointer-events:none;z-index:9000}
@keyframes explosionSmoke{0%{width:20px;height:20px;opacity:0}20%{opacity:.5}100%{width:70px;height:70px;opacity:0;transform:translate(-50%,-120%)}}

#battle-log{position:absolute;bottom:60px;right:10px;width:270px;max-height:180px;overflow-y:auto;background:rgba(13,17,23,.92);border:1px solid #e74c3c;border-radius:8px;padding:8px 10px;z-index:700;font-size:11px;color:#c9d1d9;display:none;backdrop-filter:blur(4px)}
#battle-log.visible{display:block;animation:logSlideIn .3s ease-out}
@keyframes logSlideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
#battle-log .log-title{font-size:12px;color:#e74c3c;font-weight:bold;margin-bottom:4px;border-bottom:1px solid #30363d;padding-bottom:3px}
#battle-log .log-entry{padding:2px 0;color:#8b949e;line-height:1.5}
#battle-log .log-entry b{color:#f39c12}
#battle-log::-webkit-scrollbar{width:4px}
#battle-log::-webkit-scrollbar-thumb{background:#30363d;border-radius:2px}
.compass{position:absolute;top:12px;right:12px;width:36px;height:36px;z-index:600;pointer-events:none;opacity:.6}

/* v7: 遵义会议弹窗 */
#intro-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(13,17,23,.88);z-index:2000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);transition:all .5s ease-in-out}
#intro-overlay.hidden{display:none}
#intro-overlay.shrunk{display:none}
#intro-overlay.shrinking{background:transparent;backdrop-filter:none;pointer-events:none}
#intro-overlay.shrinking .intro-card{transform:scale(.06) translate(-720vw,720vh);opacity:0}

/* v9: 倒计时 */
#countdown-overlay{position:absolute;top:0;left:0;right:0;bottom:0;z-index:2100;display:none;align-items:center;justify-content:center;pointer-events:none}
#countdown-overlay.visible{display:flex}
#countdown-num{font-size:120px;font-weight:bold;color:#e74c3c;text-shadow:0 0 30px rgba(231,76,60,.8),0 0 60px rgba(231,76,60,.4);animation:cdPulse .8s ease-out}
@keyframes cdPulse{0%{transform:scale(2.5);opacity:0}30%{opacity:1}100%{transform:scale(1);opacity:.9}}
#countdown-label{position:absolute;bottom:40%;left:50%;transform:translateX(-50%);font-size:16px;color:#f39c12;letter-spacing:4px}

// Tooltip
const tooltipEl=document.createElement('div');
tooltipEl.className='unit-tooltip';
tooltipEl.style.display='none';
document.getElementById('map-wrap').appendChild(tooltipEl);

function showUnitTooltip(e,id){
  const U=UNITS[id];
  tooltipEl.innerHTML='<div class="ut-name">'+U.name+'</div><div class="ut-row"><b>指挥:</b> '+U.cmd+'</div><div class="ut-row"><b>兵力:</b> '+U.str+'</div><div class="ut-desc">'+U.desc+'</div>';
  tooltipEl.style.display='block';

  const latlng=e.target.getLatLng();
  const point=map.latLngToContainerPoint(latlng);
  const mapRect=document.getElementById('map-wrap').getBoundingClientRect();

  // 先显示以测量尺寸
  tooltipEl.style.visibility='hidden';
  tooltipEl.classList.add('visible');
  const tw=tooltipEl.offsetWidth;
  const th=tooltipEl.offsetHeight;

  // 判断: 如果单位在地图下半部分，tooltip 放上方；否则放下方
  const fromBottom=mapRect.height-point.y;
  let left=point.x-tw/2;
  let top;

  if(fromBottom<th+30){
    // 放上方
    top=point.y-th-12;
    tooltipEl.style.borderBottom='4px solid #58a6ff';
    tooltipEl.style.borderTop='1px solid #58a6ff';
  }else{
    // 放下方
    top=point.y+22;
    tooltipEl.style.borderTop='4px solid #58a6ff';
    tooltipEl.style.borderBottom='1px solid #58a6ff';
  }

  // 边界检测
  if(left<4)left=4;
  if(left+tw>mapRect.width-4)left=mapRect.width-tw-4;
  if(top<4)top=4;

  tooltipEl.style.left=left+'px';
  tooltipEl.style.top=top+'px';
  tooltipEl.style.visibility='visible';
}

function hideUnitTooltip(){
  tooltipEl.classList.remove('visible');
  setTimeout(()=>{tooltipEl.style.display='none';},200);
}

map.on('move zoom moveend zoomend',()=>{
  if(tooltipEl.style.display==='none')return;
  for(const id in unitMarkers){
    const m=unitMarkers[id];
    const el=m.getElement();
    if(el&&el.querySelector(':hover')){
      showUnitTooltip({target:m},id);
      return;
    }
  }
  hideUnitTooltip();
});

// ==================== v6: 军事箭头绘制 ====================
// 计算两点之间的方位角（度）
function bearing(lat1,lng1,lat2,lng2){
  const dLng=(lng2-lng1)*Math.PI/180;
  const y=Math.sin(dLng)*Math.cos(lat2*Math.PI/180);
  const x=Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180)-Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos(dLng);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}

// 在指定位置创建军事箭头标记
function createArrowMarker(lat,lng,angle,color,opacity){
  const svgSize=20;
  const half=svgSize/2;
  const svg='<svg class="am-svg" width="'+svgSize+'" height="'+svgSize+'" viewBox="0 0 '+svgSize+' '+svgSize+'">'+
    '<path d="M '+half+',2 L '+(svgSize-2)+','+(svgSize-2)+' L '+half+','+(svgSize*0.65)+' L 2,'+(svgSize-2)+' Z" '+
    'fill="'+color+'" stroke="'+color+'" stroke-width="1" opacity="'+opacity+'" '+
    'transform="rotate('+angle+' '+half+' '+half+')"/></svg>';
  return L.marker([lat,lng],{
    icon:L.divIcon({className:'arrow-marker',html:svg,iconSize:[svgSize,svgSize],iconAnchor:[half,half]}),
    interactive:false,
    zIndexOffset:800
  });
}

// ==================== 动画函数（v18: 降帧开销）====================
function animateMarker(marker,fromLatlng,toLatlng,duration,onComplete){
  const start=performance.now();
  const fromLat=fromLatlng[0],fromLng=fromLatlng[1];
  const toLat=toLatlng[0],toLng=toLatlng[1];
  const dLat=toLat-fromLat,dLng=toLng-fromLng;
  let rafId;
  function frame(now){
    const elapsed=now-start;
    const t=elapsed>=duration?1:elapsed/duration;
    const eased=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    marker.setLatLng([fromLat+dLat*eased,fromLng+dLng*eased]);
    if(t<1)rafId=requestAnimationFrame(frame);
    else if(onComplete)onComplete();
  }
  rafId=requestAnimationFrame(frame);
}

// v19: 时间轴滑块平滑滑动
let timelineRAF=null;
function animateTimelineSlider(toVal,duration){
  const slider=document.getElementById('timeline');
  const fromVal=parseFloat(slider.value);
  if(duration<=0||fromVal===toVal){slider.value=toVal;return;}
  if(timelineRAF)cancelAnimationFrame(timelineRAF);
  const start=performance.now();
  function frame(now){
    const elapsed=now-start;
    const t=elapsed>=duration?1:elapsed/duration;
    const eased=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    slider.value=fromVal+(toVal-fromVal)*eased;
    if(t<1)timelineRAF=requestAnimationFrame(frame);
  }
  timelineRAF=requestAnimationFrame(frame);
}

function createExplosion(latlng,intensity){

  // 闪光

  shock.style.animation='explosionShock .8s ease-out forwards';
  wrap.appendChild(shock);setTimeout(()=>shock.remove(),800);

  for(let i=0;i<debrisCount;i++){

    debris.style.position='absolute';debris.style.left=x+'px';debris.style.top=y+'px';
    debris.style.width='4px';debris.style.height='4px';debris.style.borderRadius='50%';
    debris.style.transform='translate(-50%,-50%)';debris.style.zIndex='9000';debris.style.pointerEvents='none';
    const angle=(Math.PI*2/debrisCount)*i+Math.random()*0.5;
    const dist=30+Math.random()*50;
    const dx=Math.cos(angle)*dist,dy=Math.sin(angle)*dist;
    const colors=['#ff5722','#ff9800','#ffeb3b','#e91e63'];
    debris.style.background=colors[i%4];debris.style.boxShadow='0 0 4px '+debris.style.background;
    debris.animate([{transform:'translate(-50%,-50%) translate(0,0) scale(1)',opacity:1},{transform:'translate(-50%,-50%) translate('+dx+'px,'+dy+'px) scale(0)',opacity:0}],{duration:500+Math.random()*400,easing:'ease-out',fill:'forwards'});
    wrap.appendChild(debris);setTimeout(()=>debris.remove(),1000);
  }
}

let curStage=0,isPlaying=false,playTimer=null;

// v6: 绘制路线 + 军事箭头
function drawRoute(from,to,color,isCurrent,stageId,unitId){
  const a=from,b=to;
  const midLat=(a.lat+b.lat)/2+0.02;
  const midLng=(a.lng+b.lng)/2;
  const path=[[a.lat,a.lng],[midLat,midLng],[b.lat,b.lng]];

  if(isCurrent){
    // 当前路线 - 高亮粗线
    L.polyline(path,{color:color,weight:3,opacity:0.7,dashArray:'10 5',smoothFactor:1}).addTo(routeCurrentGroup);
    // 当前箭头 - 在终点处绘制方向箭头
    const angle=bearing(midLat,midLng,b.lat,b.lng);
    createArrowMarker(b.lat,b.lng,angle,color,0.85).addTo(arrowCurrentGroup);
  }else{
    // 历史路线 - 淡线
    L.polyline(path,{color:color,weight:2,opacity:0.25,dashArray:'6 4',smoothFactor:1}).addTo(routeHistoryGroup);
    // 历史箭头
    const angle=bearing(midLat,midLng,b.lat,b.lng);
    createArrowMarker(b.lat,b.lng,angle,color,0.3).addTo(arrowHistoryGroup);
  }
}

function renderStage(n,instant){
  if(animating&&!instant)return;
  hideUnitTooltip();
  const S=STAGES[n];
  const prev=STAGES[n-1];
  const duration=instant?0:1800;

  routeCurrentGroup.clearLayers();
  battleLayerGroup.clearLayers();
  arrowCurrentGroup.clearLayers();

  // 绘制当前阶段路线 + 箭头（高亮）+ 加入历史
  if(n>0&&prev){
    for(const id in S.u){
      if(!prev.u[id])continue;
      const a=prev.u[id],b=S.u[id];
      if(a.lat===b.lat&&a.lng===b.lng)continue;
      const U=UNITS[id];
      const color=U.side==='red'?'#e74c3c':'#3498db';
      // 当前路线 - 高亮 + 箭头
      drawRoute(a,b,color,true,n,id);
      // 同时加入历史组（永久保留）
      if(!renderedStages.has(n+'-'+id)){
        drawRoute(a,b,color,false,n,id);
        renderedStages.add(n+'-'+id);
      }
    }
  }

  // 如果跳转，补全所有之前阶段的路线
  if(instant&&n>0){
    for(let i=1;i<=n;i++){
      const p0=STAGES[i-1],p1=STAGES[i];
      for(const id in p1.u){
        if(!p0.u[id])continue;
        const a=p0.u[id],b=p1.u[id];
        if(a.lat===b.lat&&a.lng===b.lng)continue;
        const U=UNITS[id];
        const color=U.side==='red'?'#e74c3c':'#3498db';
        if(!renderedStages.has(i+'-'+id)){
          drawRoute(a,b,color,false,i,id);
          renderedStages.add(i+'-'+id);
        }
      }
    }
  }

  // 动画移动部队
  animating=true;
  let completed=0,total=0;
  for(const id in S.u)total++;
  if(total===0)animating=false;

  for(const id in S.u){
    const target=S.u[id];
    const marker=unitMarkers[id];
    marker.setOpacity(1);
    const from=unitCurrentPos[id];
    if(from&&!instant&&(from[0]!==target.lat||from[1]!==target.lng)){
      animateMarker(marker,from,[target.lat,target.lng],duration,()=>{
        completed++;unitCurrentPos[id]=[target.lat,target.lng];
        if(completed>=total)animating=false;
      });
    }else{
      marker.setLatLng([target.lat,target.lng]);
      unitCurrentPos[id]=[target.lat,target.lng];
      completed++;
      if(completed>=total)animating=false;
    }
  }
  for(const id in UNITS){
    if(!S.u[id])unitMarkers[id].setOpacity(0);
  }

  // v6: 爆炸延迟到部队移动完成后（duration 而非 duration*0.5）
  setTimeout(()=>{
    S.b.forEach(b=>{
      const isChieftain=b.n.includes('蒋介石');
      let icon;
      if(isChieftain){
        icon=L.divIcon({className:'battle-marker',html:'<div class="bm-icon">✈</div><div class="bm-label">'+b.n+'</div>',iconSize:[24,24],iconAnchor:[12,12]});
      }else{
        icon=L.divIcon({className:'battle-marker',html:'<div class="bm-icon">⚔</div><div class="bm-label">'+b.n+'</div>',iconSize:[24,24],iconAnchor:[12,12]});
      }
      const m=L.marker([b.lat,b.lng],{icon:icon,zIndexOffset:500});
      m.bindPopup('<h4>'+(isChieftain?'✈':'⚔')+' '+b.n+'</h4><div class="pop-row">'+b.d+'</div>');
      m.on('popupopen',function(e){var el=e.popup.getElement();if(el){el.addEventListener('mouseleave',function(){m.closePopup();});}});
      m.on('click',()=>{
        createExplosion([b.lat,b.lng],b.intensity||3);
        addBattleLog(b.n,'战斗再次打响！');
      });
      m.addTo(battleLayerGroup);
    });
    if(S.b.length>0&&!instant){
      // v6: 爆炸在部队到达后触发（已由外层 setTimeout duration 保证）
      chainExplosions(S.b);
      S.b.forEach(b=>{
        if(!b.n.includes('蒋介石')){
          for(let i=0;i<2;i++)setTimeout(()=>muzzleFlash([b.lat,b.lng]),i*300); // v18: 3→2
        }
      });
      showBattleLog(S);
    }else if(S.b.length>0&&instant){
      S.b.forEach(b=>setTimeout(()=>createExplosion([b.lat,b.lng],2),100));
      showBattleLog(S);
    }else{
      hideBattleLog();
    }
  },instant?100:duration);  // v6: duration（完整移动后）而非 duration*0.5

  if(S.center&&cameraFollow)map.flyTo(S.center,S.zoom||9,{duration:instant?0:1});

  updateInfo(n);
  // v19: 时间轴平滑滑动而非跳转
  animateTimelineSlider(n,instant?0:duration);
  document.getElementById('s-num').textContent=n;
  document.getElementById('s-name').textContent=S.name;
  document.getElementById('s-date').textContent=S.date;
  const nums=["零","一","二","三","四","五","六","七","八","九","十"];
  document.getElementById('po-num').textContent="第"+nums[n]+"阶段";
  document.getElementById('po-name').textContent=S.name;
  document.getElementById('po-date').textContent=S.date;
  updateActiveTick(n);
  refreshDeployLayers(n);
  setClockForStage(n);
  maybePlayCloseup(n,instant);
}

function updateActiveTick(n){
  document.querySelectorAll('.tick').forEach((t,i)=>{
    t.classList.toggle('active',i===n);
  });
}

// ==================== 时间轴刻度 ====================
function buildTimelineTicks(){
  const container=document.getElementById('timeline-ticks');
  container.innerHTML='';
  STAGES.forEach((s,i)=>{
    const tick=document.createElement('div');
    const isCrossing=!!s.isCrossing;
    tick.className='tick'+(s.hasBattle?' battle':'')+(isCrossing?' crossing':'')+(i===0?' active':'');
    // 上下错位：偶数索引在轴上方，奇数索引在轴下方
    const posClass=i%2===0?'above':'below';
    // 渡江次数标识
    let tag='';
    if(isCrossing){
      const cn=['一','二','三','四'];
      const count=STAGES.slice(0,i+1).filter(st=>st.isCrossing).length;
      tag=cn[count-1]+'渡';
    }else if(s.hasBattle){
      tag='⚔';
    }
    // 日期和标签合并为一个文本，放在轴上方或轴下方
    const labelText=s.timeline+(tag?' '+tag:'');
    tick.innerHTML='<div class="tick-label '+posClass+'">'+labelText+'</div><div class="tick-line"></div>';
    container.appendChild(tick);
  });
}

// ==================== 小时级时钟（纯展示，不驱动地图/阶段）====================
// 时间轴只按小时走动供阅读；阶段切换仍由播放控制驱动，二者互不影响。
let clockTime={y:1935,m:1,d:19,h:6};
let clockTimer=null;
function stageStartDate(n){
  const t=STAGES[n].timeline; // 形如 "01.29" 或 "04.上"
  const m=parseInt(t.slice(0,2),10);
  const d=t.indexOf('上')>=0?1:(parseInt(t.slice(3),10)||1);
  return {y:1935,m:m,d:d,h:STAGES[n].isCrossing?6:8};
}
function formatClock(t){
  const p=n=>String(n).padStart(2,'0');
  return t.y+'-'+p(t.m)+'-'+p(t.d)+' '+p(t.h)+':00';
}
function updateClockDisplay(){
  const txt=formatClock(clockTime);
  const top=document.getElementById('po-clock');
  if(top)top.innerHTML='⏱ <b>'+txt+'</b>';
  const cc=document.getElementById('cc-clock');
  if(cc)cc.textContent=txt;
}
function setClockForStage(n){clockTime=stageStartDate(n);updateClockDisplay();}
function advanceClockHour(){
  clockTime.h++;
  if(clockTime.h>=24){clockTime.h=0;clockTime.d++;}
  const dim=new Date(clockTime.y,clockTime.m,0).getDate();
  if(clockTime.d>dim){clockTime.d=1;clockTime.m++;}
  if(clockTime.m>12){clockTime.m=1;clockTime.y++;}
  updateClockDisplay();
}
function startClockTicker(){
  stopClockTicker();
  const speed=parseInt(document.getElementById('speed').value,10)||4000;
  clockTimer=setInterval(()=>{if(!closeupActive)advanceClockHour();},Math.max(120,Math.round(speed/14)));
}
function stopClockTicker(){if(clockTimer){clearInterval(clockTimer);clockTimer=null;}}

// ==================== 渡赤水特写（四次渡河）====================
// 特写是独立示意图：逐小时演示红军从出发岸渡过赤水河抵达对岸，
// 只更新展示内容与时钟，不调用 renderStage、不改变地图视角与部队位置。
const CROSSINGS={
  2:{n:'一渡赤水',ford:'土城 · 元厚渡口',from:'东岸 · 土城',to:'西岸 · 川南',units:['r1','r3','rc'],note:'西渡赤水，进入川南'},
  4:{n:'二渡赤水',ford:'太平渡 · 二郎滩渡口',from:'西岸 · 川南',to:'东岸 · 黔北',units:['r1','r3','r5'],note:'回师黔北，再占遵义'},
  7:{n:'三渡赤水',ford:'茅台渡口',from:'东岸 · 茅台',to:'西岸 · 川南',units:['r1','r3','rc'],note:'西渡调敌，制造北上假象'},
  8:{n:'四渡赤水',ford:'太平渡 · 二郎滩 · 九溪口',from:'西岸 · 川南',to:'东岸 · 黔北',units:['r1','r3','rc'],note:'东返黔北，跳出合围'}
};
const CROSSING_HOURS=12;
let closeupTimer=null,closeupActive=false;

function stopCloseup(){
  closeupActive=false;
  if(closeupTimer){clearInterval(closeupTimer);closeupTimer=null;}
  const box=document.getElementById('crossing-closeup');
  if(box)box.classList.remove('visible');
}
function buildCloseupScene(n){
  const C=CROSSINGS[n];
  document.getElementById('cc-name').textContent=C.n;
  document.getElementById('cc-ford').textContent=C.ford+' ｜ '+C.from+' → '+C.to+' ｜ '+C.note;
  document.getElementById('cc-banka').textContent=C.from;
  document.getElementById('cc-bankb').textContent=C.to;
  const troops=document.getElementById('cc-troops');
  troops.innerHTML='';
  C.units.forEach((id,i)=>{
    const dot=document.createElement('div');
    dot.className='cc-dot'+(id==='rc'?' west':'');
    dot.textContent=UNITS[id].short;
    dot.dataset.lane=String(i);
    troops.appendChild(dot);
  });
}
function paintCloseupProgress(n,step){
  const C=CROSSINGS[n];
  const p=step/CROSSING_HOURS;
  document.querySelectorAll('#cc-troops .cc-dot').forEach(dot=>{
    const lane=parseInt(dot.dataset.lane,10)%3;
    dot.style.left=(22+(78-22)*p)+'%';
    dot.style.top=(24+lane*26)+'%';
  });
  const status=document.getElementById('cc-status');
  if(status){
    if(step<CROSSING_HOURS){
      const h=(parseInt(stageStartDate(n).h,10)+step)%24;
      status.innerHTML='渡河中 · 第 <b>'+(step+1)+'</b> 小时（'+String(h).padStart(2,'0')+':00）';
    }else{
      status.innerHTML='<b>渡河完成</b> · 已抵'+C.to.split(' · ')[1];
    }
  }
  // 特写时钟与顶部时钟共用同一份时间：按小时推进，仅用于展示
  clockTime=stageStartDate(n);
  for(let i=0;i<step;i++)advanceClockHour();
}
function playCloseup(n){
  if(!CROSSINGS[n])return;
  stopCloseup();
  buildCloseupScene(n);
  closeupActive=true;
  document.getElementById('crossing-closeup').classList.add('visible');
  paintCloseupProgress(n,0);
  const speed=parseInt(document.getElementById('speed').value,10)||4000;
  const stepMs=Math.max(90,Math.min(420,Math.round(speed*0.78/CROSSING_HOURS)));
  let step=0;
  closeupTimer=setInterval(()=>{
    step++;
    paintCloseupProgress(n,step);
    if(step>=CROSSING_HOURS){clearInterval(closeupTimer);closeupTimer=null;closeupActive=false;}
  },stepMs);
}
function maybePlayCloseup(n,instant){
  if(!CROSSINGS[n]){stopCloseup();return;}
  if(!instant){playCloseup(n);return;}
  // 手动跳转：展示静态特写，点「重播」可观看完整渡河过程
  stopCloseup();
  buildCloseupScene(n);
  paintCloseupProgress(n,0);
  document.getElementById('crossing-closeup').classList.add('visible');
  document.getElementById('cc-status').innerHTML='点击 <b>重播</b> 观看渡河特写';
}

// ==================== 播放控制 ====================
function play(){
  if(curStage>=STAGES.length-1){curStage=0;renderStage(0,true);}
  isPlaying=true;
  document.getElementById('btn-play').textContent="⏸ 暂停";
  document.getElementById('btn-play').classList.add('btn-pause');
  const speed=parseInt(document.getElementById('speed').value);
  playTimer=setInterval(()=>{
    if(curStage<STAGES.length-1){curStage++;renderStage(curStage);}
    else pause();
  },speed);
  startClockTicker();
}
function pause(){
  isPlaying=false;
  document.getElementById('btn-play').textContent="▶ 自动播放";
  document.getElementById('btn-play').classList.remove('btn-pause');
  clearInterval(playTimer);
  stopClockTicker();
}
function togglePlay(){if(isPlaying)pause();else play();}
function nextStage(){if(isPlaying)pause();if(curStage<STAGES.length-1){curStage++;renderStage(curStage);}}
function prevStage(){if(isPlaying)pause();if(curStage>0){curStage--;renderStage(curStage,true);}}
function jumpTo(n){if(isPlaying)pause();curStage=n;renderStage(n,true);}

        '<b>历史意义：</b>遵义会议事实上确立了以毛泽东为核心的党中央的正确领导，挽救了党、挽救了红军、挽救了中国革命，为四渡赤水等一系列军事胜利奠定了领导基础。'+
        '</div>'+
        '<div style="text-indent:0;font-size:11px;color:#8b949e;margin-top:8px">遵义会议后，毛泽东重回军事指挥岗位。面对蒋介石40万大军的围追堵截，毛泽东以3万红军演绎了<b style="color:#e74c3c">四渡赤水</b>这一军事史上的经典机动战——后被毛泽东本人称为"平生得意之笔"。</div>';
      document.body.appendChild(tip);
    }
  });
  // v8: 敌方部署图层切换
  document.getElementById('btn-fort').addEventListener('click',function(){
    deployVisible.fort=!deployVisible.fort;
    this.classList.toggle('active',deployVisible.fort);
    if(deployVisible.fort){
      renderFortifications();
      fortGroup.addTo(map);
    }else{
      map.removeLayer(fortGroup);
    }
  });
  document.getElementById('btn-force').addEventListener('click',function(){
    deployVisible.force=!deployVisible.force;
    this.classList.toggle('active',deployVisible.force);
    if(deployVisible.force){
      renderForces(curStage);
      forceGroup.addTo(map);
      document.getElementById('troop-stats').classList.add('visible'); // v18: 显示兵力统计
    }else{
      map.removeLayer(forceGroup);
      document.getElementById('troop-stats').classList.remove('visible'); // v18: 隐藏兵力统计
    }
  });
  document.getElementById('btn-territory').addEventListener('click',function(){
    deployVisible.territory=!deployVisible.territory;
    this.classList.toggle('active',deployVisible.territory);
    if(deployVisible.territory){
      renderTerritories(curStage);
      territoryGroup.addTo(map);
    }else{
      map.removeLayer(territoryGroup);
    }
  });
}
map.whenReady(init);
</script>
</body>
